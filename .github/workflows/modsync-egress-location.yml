name: ModSync public egress location check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  location:
    if: github.repository == 'kolto-labs/mod-builds'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Observe public egress location
        timeout-minutes: 1
        shell: bash
        run: python3 tools/modsync-ci/egress_location.py --output "$RUNNER_TEMP/steam-egress-location.json"
      - name: Publish sanitized public location result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steam-egress-location-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steam-egress-location.json
          if-no-files-found: error
          retention-days: 1
