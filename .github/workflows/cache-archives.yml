# Repository-owned archive producer. Retired pack publication/renewal stays retired.
# Existing generations are read-only recovery inputs; no cache deletion is performed.
name: Full-run archive preparation
on:
  workflow_call:
    inputs:
      guide_repository: {type: string, required: true}
      guide_sha: {type: string, required: true}
      games: {type: string, default: '["k1","k2"]'}
      cache_writer: {type: boolean, default: false}
      artifact_repository: {type: string, default: ''}
    outputs:
      archive_cache_key:
        description: Exact verified producer cache key; empty on producer failure
        value: ${{ jobs.archives.outputs.archive_cache_key }}
    secrets:
      DIAGNOSTICS_ENCRYPTION_KEY: {required: true}
      ARTSTORE_READ_TOKEN: {required: false}
      CACHE_ENCRYPTION_KEY: {required: false}
      MOD_CACHE_S3_READ_ACCESS_KEY_ID: {required: false}
      MOD_CACHE_S3_READ_SECRET_ACCESS_KEY: {required: false}
      MOD_CACHE_S3_ENDPOINT: {required: false}
permissions: {contents: read, actions: read}
jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency: {group: fullrun-mod-cache-writer, cancel-in-progress: false}
    outputs:
      archive_cache_key: ${{ steps.refresh.outputs.archive_cache_key }}
    env:
      ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
      ARTSTORE_TOKEN: ${{ secrets.ARTSTORE_READ_TOKEN || github.token }}
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
      RCLONE_CONFIG_MODCACHE_TYPE: s3
      RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
      RCLONE_CONFIG_MODCACHE_REGION: auto
      RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
      RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
      MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 7zip 7zip-rar megatools libarchive-tools
          python -m pip install gdown==5.2.0
          python tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore existing archive accelerator
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: mod-archives-
          restore-keys: mod-archives-
      - name: Verify and refresh required archives
        id: refresh
        env:
          GAMES: ${{ inputs.games }}
        run: |
          python tools/modsync-ci/fullrun_stage.py refresh --guides . --games "$GAMES" \
            --cache "$RUNNER_TEMP/mod-cache" --output "$RUNNER_TEMP/archive-evidence"
      - name: Save verified public mod archive accelerator
        if: ${{ inputs.cache_writer && steps.refresh.outcome == 'success' && steps.refresh.outputs.archive_cache_key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.refresh.outputs.archive_cache_key }}

      - name: Retain encrypted stage evidence
        if: ${{ success() || failure() }}
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/archive-evidence
          name: cache-archives-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
