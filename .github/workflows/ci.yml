name: CI

# One workflow for game acquisition, the mod archive cache and every install lane.
# Caches only make runs faster. A missing cache is refilled; the run fails only
# when a job cannot actually get the game, cannot get a required mod archive from
# any source (cache, P2P, the optional R2 bucket, the website) or finish its install.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', 'meta.json', 'README.md']
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
    inputs:
      seed_archives:
        description: Seed the archive cache from the staging remote (dev only; skips every other job)
        type: boolean
        default: false
      seed_dry_run:
        description: Seed only - verify every staged file against its pin but write nothing to the cache
        type: boolean
        default: false

permissions:
  contents: read

env:
  # ModSync.ts ref the typescript install lanes build. Physical install
  # (--ci-physical-install) exists only on this branch, not on the repository default branch.
  MODSYNC_TS_REF: ${{ vars.MODSYNC_TS_REF || 'feat/physical-install' }}
  # odynsscomp rev the typescript install lanes build the bionsscomp NSS compiler from. Keep it equal to the
  # rev the Rust lanes' Cargo.lock pins.
  NSSCOMP_REV: 00c53a9

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fork and dependabot pull requests get no secrets, so they skip every job (install jobs need game).
  game:
    name: game (${{ matrix.game }})
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1  # one Steam account
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      APP_ID: ${{ matrix.game == 'k1' && '32370' || '208580' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look up game cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          lookup-only: true

      - name: Download game with SteamCMD
        if: steps.cache.outputs.cache-matched-key == ''
        timeout-minutes: 45
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_GUARD_CODES: ${{ secrets.STEAM_GUARD_CODES }}  # optional: whitespace-separated Steam Guard backup codes
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          steamcmd="$RUNNER_TEMP/steamcmd/steamcmd.sh"
          "$steamcmd" +quit </dev/null >/dev/null
          options=(+@ShutdownOnFailedCommand 1 +@sSteamCmdForcePlatformType windows
            +force_install_dir "$RUNNER_TEMP/game")
          install=(+app_update "$APP_ID" validate +quit)
          if [[ -n "$STEAM_CONFIG_VDF" ]]; then
            umask 077
            mkdir -p "$HOME/Steam/config"
            printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"
            "$steamcmd" "${options[@]}" +@NoPromptForPassword 1 +login "$STEAM_USERNAME" "${install[@]}" </dev/null || echo "::warning::steamcmd (saved login) exited with status $?"
          fi
          if [[ ! -f "$RUNNER_TEMP/game/chitin.key" ]]; then
            printf '%s\n' "$STEAM_PASSWORD" | "$steamcmd" "${options[@]}" +login "$STEAM_USERNAME" "${install[@]}" || echo "::warning::steamcmd (password login) exited with status $?"
          fi
          # Fallback: Steam Guard backup codes (each is single-use; spent codes are rejected quickly).
          for code in $STEAM_GUARD_CODES; do
            [[ -f "$RUNNER_TEMP/game/chitin.key" ]] && break
            echo "Trying a Steam Guard backup code."
            "$steamcmd" "${options[@]}" +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "$code" "${install[@]}" </dev/null || echo "::warning::steamcmd (backup code) exited with status $?"
          done
          test -f "$RUNNER_TEMP/game/chitin.key"
          # A real Steam KOTOR install always ships modules/*.rim (K2 names the directory Modules/); fail the game job, never cache a partial download.
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "after SteamCMD" --require-modules \
            || { echo "::error::$GAME SteamCMD download has no modules/*.rim; see the game inventory above and docs/steam.md"; exit 1; }
          python tools/modsync-ci/game_cache.py pack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"

      - name: Save game cache
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1

  mods:
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    continue-on-error: true  # a stale archive cache must never block the install lanes
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: write
    # is only for the prune step (gh cache delete). It also covers the artifact-store reads here;
    # artifact pruning has its own job (artstore-refresh).
    permissions:
      contents: read
      actions: write
    outputs:
      # Content-addressed key of the archive cache this run saved or found; empty when none.
      archive_cache_key: ${{ steps.archive_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Restore mod archive cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: mod-archives-
          restore-keys: mod-archives-
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      # Optional extra: keeps the R2 bucket current when its secrets exist. Never fails the run.
      - name: Refresh the R2 bucket (optional)
        continue-on-error: true
        timeout-minutes: 40
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: python tools/modsync-ci/refresh_archives.py --max-items 500
      # Revalidates every archive (conditional request), downloads only new or changed ones
      # (artifact store, P2P, then the optional bucket, then the website) and keeps what fits the 10 GB
      # repository cache. GITHUB_TOKEN switches the artifact-store tier on; --emit-stage-manifest lists
      # the cached objects the store lacks or will soon expire, for the publish steps at the end.
      - name: Refresh the mod archive cache
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          status=0
          python tools/modsync-ci/cache.py refresh --cache-dir "$RUNNER_TEMP/mod-cache" \
            --cache-limit-bytes 2684354560 --emit-stage-manifest "$RUNNER_TEMP/stage-manifest.json" \
            --stage-max-bytes 3221225472 --stage-total-bytes 9663676416 \
            "${remote[@]}" > "$RUNNER_TEMP/refresh-report.json" || status=$?
          python -c 'import collections,json,sys; print(dict(collections.Counter(e.get("status") for e in json.load(open(sys.argv[1]))["entries"])))' "$RUNNER_TEMP/refresh-report.json" || true
          exit "$status"
      # The key is a hash of manifest.json without its per-run timestamps (checked_at, imported_at), so
      # unchanged content gives an unchanged key and no new entry. Empty when there is no manifest.
      - name: Compute the archive cache key
        id: archive_key
        if: always()
        run: |
          manifest="$RUNNER_TEMP/mod-cache/manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "No manifest.json in the mod cache; nothing to save."
            exit 0
          fi
          digest=$(python3 - "$manifest" <<'PY'
          import hashlib, json, sys
          volatile = {"checked_at", "imported_at"}
          def strip(value):
              if isinstance(value, dict):
                  return {key: strip(item) for key, item in value.items() if key not in volatile}
              if isinstance(value, list):
                  return [strip(item) for item in value]
              return value
          with open(sys.argv[1], encoding="utf-8") as stream:
              document = strip(json.load(stream))
          canonical = json.dumps(document, sort_keys=True, separators=(",", ":"))
          print(hashlib.sha256(canonical.encode("utf-8")).hexdigest()[:16])
          PY
          )
          echo "key=mod-archives-$digest" >> "$GITHUB_OUTPUT"
      - name: Look up the archive cache entry
        id: archive_exists
        if: always() && steps.archive_key.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.archive_key.outputs.key }}
          lookup-only: true
      # Entries are immutable. An existing key is skipped here; if two runs race for it, the save
      # action logs "Failed to save: Unable to reserve cache ... another job may be creating this
      # cache" at info level, which is not an error.
      - name: Save mod archive cache
        id: archive_save
        if: always() && steps.archive_key.outputs.key != '' && steps.archive_exists.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ steps.archive_key.outputs.key }}
      # Keeps one mod-archives-* entry so the repository stays under the 10 GB Actions cache cap.
      # Only runs once the current key is confirmed present, and only touches mod-archives-* keys,
      # never game-* or steam-sealed-*.
      - name: Prune stale mod archive caches
        if: always() && steps.archive_key.outputs.key != '' && (steps.archive_save.outcome == 'success' || steps.archive_exists.outputs.cache-hit == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.archive_key.outputs.key }}
        run: |
          mapfile -t keys < <(gh cache list --key mod-archives- --limit 100 --json key --jq '.[].key' | sort -u)
          if ! printf '%s\n' "${keys[@]}" | grep -Fxq -- "$CURRENT_KEY"; then
            echo "::warning::$CURRENT_KEY is not in the cache list; leaving every mod archive cache in place."
            exit 0
          fi
          for key in "${keys[@]}"; do
            [[ "$key" == mod-archives-* && "$key" != "$CURRENT_KEY" ]] || continue
            echo "Deleting stale cache $key"
            gh cache delete "$key"
          done
      # Publishes cached objects the artifact store lacks (or will soon expire) as sealed pack artifacts
      # plus an index fragment. Never on pull requests. A failure here only warns; it never fails the job.
      # The 3 GiB pack budget keeps the 2.5 GiB cache in one pack; the three upload slots are headroom.
      - name: Stage artifact store packs
        id: stage
        if: ${{ always() && contains(fromJSON('["push","schedule","release","workflow_dispatch"]'), github.event_name) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/stage-manifest.json"
          if [[ -z "$CACHE_ENCRYPTION_KEY" ]]; then
            echo "::notice::CACHE_ENCRYPTION_KEY is empty; not publishing to the artifact store."
            exit 0
          fi
          if [[ ! -s "$manifest" ]]; then
            echo "No stage manifest; nothing to publish to the artifact store."
            exit 0
          fi
          if ! python tools/modsync-ci/artstore.py stage --manifest-json "$manifest" \
              --packdir "$RUNNER_TEMP/artstore-pack" --pack-budget 3221225472 > "$RUNNER_TEMP/artstore-stage.json"; then
            echo "::warning::Artifact store staging failed; nothing was published this run."
            exit 0
          fi
          python3 - "$RUNNER_TEMP/artstore-stage.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              summary = json.load(stream)
          packs = summary.get("packs") or []
          if len(packs) > 3:
              print("::warning::Artifact store staged %d packs; only the first 3 are uploaded, the rest are staged again next run." % len(packs), file=sys.stderr)
          for slot in range(3):
              print("pack%d=%s" % (slot + 1, os.path.basename(packs[slot]["dir"]) if slot < len(packs) else ""))
          print("index=%s" % ((summary.get("index_name") or "") if packs else ""))
          PY
      - name: Upload artifact store pack 1
        id: up1
        if: ${{ always() && steps.stage.outputs.pack1 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack1 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack1 }}
          if-exists: skip
      - name: Upload artifact store pack 2
        id: up2
        if: ${{ always() && steps.stage.outputs.pack2 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack2 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack2 }}
          if-exists: skip
      - name: Upload artifact store pack 3
        id: up3
        if: ${{ always() && steps.stage.outputs.pack3 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack3 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack3 }}
          if-exists: skip
      # The index goes last and only when a pack made it. Index entries whose pack did not upload are
      # reconciled away when the index is read, so the store never serves a missing pack.
      - name: Upload artifact store index
        id: upindex
        if: ${{ always() && steps.stage.outputs.index != '' && (steps.up1.outcome == 'success' || steps.up2.outcome == 'success' || steps.up3.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.index }}
          directory: ${{ runner.temp }}/artstore-pack/index
          if-exists: skip
      - name: Report artifact store publish problems
        if: ${{ always() && (steps.stage.outcome == 'failure' || steps.up1.outcome == 'failure' || steps.up2.outcome == 'failure' || steps.up3.outcome == 'failure' || steps.upindex.outcome == 'failure') }}
        run: echo "::warning::Artifact store publish failed; the install lanes fall back to the other archive sources."
      # Read-path proof from a real runner: fetch the smallest blob just published (or, when nothing was
      # published this run, the smallest blob in `artstore.py list`) back through the store and compare its
      # SHA-256. A failure is a visible ::warning:: and a failed (but non-blocking) step, never a failed job.
      - name: Verify artifact store round trip
        id: roundtrip
        if: ${{ always() && contains(fromJSON('["push","schedule","release","workflow_dispatch"]'), github.event_name) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHE_ENCRYPTION_KEY" ]]; then
            echo "::notice::CACHE_ENCRYPTION_KEY is empty; skipping the artifact store round trip."
            exit 0
          fi
          trap 'rm -rf "$RUNNER_TEMP/artstore-roundtrip"' EXIT
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys, time

          temp = os.environ["RUNNER_TEMP"]
          tool = "tools/modsync-ci/artstore.py"
          sha_re = re.compile(r"^[0-9a-f]{64}$")
          units = {"B": 1, "KiB": 1024, "MiB": 1024 ** 2, "GiB": 1024 ** 3}

          def summary(line):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write(line + "\n")

          def fail(reason):
              print("::warning::artstore round trip FAILED: %s" % reason, flush=True)
              summary("artstore round trip FAILED: %s" % reason)
              sys.exit(1)

          def pick_published():
              try:
                  with open(os.path.join(temp, "artstore-stage.json"), encoding="utf-8") as stream:
                      staged = json.load(stream).get("staged") or []
                  with open(os.path.join(temp, "stage-manifest.json"), encoding="utf-8") as stream:
                      paths = {entry["sha256"]: entry["path"] for entry in json.load(stream)}
              except (OSError, ValueError, KeyError, TypeError):
                  return None
              sizes = {sha: os.path.getsize(paths[sha]) for sha in staged
                       if sha in paths and os.path.isfile(paths[sha])}
              if not sizes:
                  return None
              sha = min(sizes, key=lambda item: (sizes[item], item))
              return sha, "published"

          def pick_listed():
              listing = subprocess.run([sys.executable, tool, "list"], stdout=subprocess.PIPE, text=True)
              if listing.returncode != 0:
                  fail("artstore list exited %d" % listing.returncode)
              best = None
              for line in listing.stdout.splitlines():
                  cols = line.split()
                  if len(cols) < 6 or not sha_re.match(cols[0]) or cols[-1] == "expired":
                      continue
                  try:
                      size = float(cols[1]) * units[cols[2]]
                  except (ValueError, KeyError):
                      continue
                  if best is None or (size, cols[0]) < best[0]:
                      best = ((size, cols[0]), cols[0])
              return (best[1], "listed") if best else None

          picked = pick_published() or pick_listed()
          if picked is None:
              print("::notice::The artifact store lists no blobs and nothing was published; no round trip to verify.")
              summary("artstore round trip skipped: the store holds no blobs")
              sys.exit(0)
          sha, source = picked

          workdir = os.path.join(temp, "artstore-roundtrip")
          os.makedirs(workdir, exist_ok=True)
          dest = os.path.join(workdir, "blob")
          for attempt in range(1, 4):
              if os.path.exists(dest):
                  os.remove(dest)
              start = time.monotonic()
              code = subprocess.run([sys.executable, tool, "fetch", "--sha256", sha, "--dest", dest,
                                     "--workdir", workdir]).returncode
              elapsed = time.monotonic() - start
              if code != 3 or attempt == 3:
                  break
              time.sleep(20)
          if code != 0:
              fail("fetch of %s blob %s %s (exit %d)" % (source, sha[:12], "missed" if code == 3 else "failed", code))

          digest = hashlib.sha256()
          size = 0
          with open(dest, "rb") as stream:
              for chunk in iter(lambda: stream.read(1 << 20), b""):
                  digest.update(chunk)
                  size += len(chunk)
          if digest.hexdigest() != sha:
              fail("sha256 mismatch for %s blob %s" % (source, sha[:12]))
          line = "artstore round trip OK: %s %d bytes in %.1fs (%s blob)" % (sha[:12], size, elapsed, source)
          print(line, flush=True)
          summary(line)
          PY

  # Scheduled and manual only. Blobs whose artifact-store retention ends within 21 days are fetched,
  # sealed again into a new pack with a new index fragment, and then expired or superseded artifacts are
  # pruned. This is the only job (besides mods, for its cache deletes) with actions: write. It runs after
  # mods and in the same concurrency group, so two index writers never overlap.
  artstore-refresh:
    name: artstore refresh
    needs: [mods]
    if: ${{ !cancelled() && !inputs.seed_archives && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Plan the refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/artstore.py refresh-plan --within-days 21 > "$RUNNER_TEMP/refresh-plan.txt"
      # At most 8 GiB per run; what is left stays in the plan for the next scheduled run.
      - name: Fetch the blobs that are about to expire
        id: fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/artstore-refresh"
          mkdir -p "$root/blobs" "$root/work"
          : > "$root/list.tsv"
          total=0
          cap=8589934592
          while read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || continue
            if (( total >= cap )); then
              echo "::notice::Refresh byte cap reached; the next run takes the rest."
              break
            fi
            if python tools/modsync-ci/artstore.py fetch --sha256 "$sha" --dest "$root/blobs/$sha" --workdir "$root/work" > /dev/null; then
              total=$((total + $(stat -c %s "$root/blobs/$sha")))
              printf '%s\t%s\n' "$root/blobs/$sha" "$sha" >> "$root/list.tsv"
            else
              echo "::warning::Could not fetch blob ${sha:0:12} from the artifact store; skipping it."
            fi
          done < "$RUNNER_TEMP/refresh-plan.txt"
          python3 - "$root/list.tsv" "$root/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              pairs = [line.rstrip("\n").split("\t") for line in stream if line.strip()]
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump([{"path": path, "sha256": sha256} for path, sha256 in pairs], stream)
          PY
          echo "count=$(wc -l < "$root/list.tsv")" >> "$GITHUB_OUTPUT"
      - name: Stage artifact store packs
        id: stage
        if: ${{ steps.fetch.outputs.count != '0' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if ! python tools/modsync-ci/artstore.py stage --manifest-json "$RUNNER_TEMP/artstore-refresh/manifest.json" \
              --packdir "$RUNNER_TEMP/artstore-pack" --pack-budget 3221225472 > "$RUNNER_TEMP/artstore-stage.json"; then
            echo "::warning::Artifact store staging failed; nothing was refreshed this run."
            exit 0
          fi
          python3 - "$RUNNER_TEMP/artstore-stage.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              summary = json.load(stream)
          packs = summary.get("packs") or []
          if len(packs) > 3:
              print("::warning::Artifact store staged %d packs; only the first 3 are uploaded, the rest are staged again next run." % len(packs), file=sys.stderr)
          for slot in range(3):
              print("pack%d=%s" % (slot + 1, os.path.basename(packs[slot]["dir"]) if slot < len(packs) else ""))
          print("index=%s" % ((summary.get("index_name") or "") if packs else ""))
          PY
      - name: Upload artifact store pack 1
        id: up1
        if: ${{ steps.stage.outputs.pack1 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack1 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack1 }}
          if-exists: skip
      - name: Upload artifact store pack 2
        id: up2
        if: ${{ steps.stage.outputs.pack2 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack2 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack2 }}
          if-exists: skip
      - name: Upload artifact store pack 3
        id: up3
        if: ${{ steps.stage.outputs.pack3 != '' }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.pack3 }}
          directory: ${{ runner.temp }}/artstore-pack/${{ steps.stage.outputs.pack3 }}
          if-exists: skip
      - name: Upload artifact store index
        id: upindex
        if: ${{ steps.stage.outputs.index != '' && (steps.up1.outcome == 'success' || steps.up2.outcome == 'success' || steps.up3.outcome == 'success') }}
        continue-on-error: true
        uses: ./.github/actions/artstore-upload
        with:
          name: ${{ steps.stage.outputs.index }}
          directory: ${{ runner.temp }}/artstore-pack/index
          if-exists: skip
      - name: Report artifact store publish problems
        if: ${{ steps.stage.outcome == 'failure' || steps.up1.outcome == 'failure' || steps.up2.outcome == 'failure' || steps.up3.outcome == 'failure' || steps.upindex.outcome == 'failure' }}
        run: echo "::warning::Artifact store refresh upload failed; expiring blobs were not renewed this run."
      - name: Prune expired and superseded artifacts
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/modsync-ci/artstore.py prune --apply

  # Manual only: copies hand-downloaded archives from the private STAGING rclone remote into the
  # R2 cache, one file at a time, after verifying each against its reviewed pin (seed_pins.json).
  # A dispatch with seed_archives skips every other job; the shared concurrency group serializes
  # this with the scheduled refresh so the two never write the manifest at once.
  seed:
    name: seed archive cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_archives }}
    environment: mod-cache-seed
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Seed archives from staging (verified against the pins)
        env:
          SEED_STAGING_RCLONE_CONF_B64: ${{ secrets.SEED_STAGING_RCLONE_CONF_B64 }}
          SEED_DRY_RUN: ${{ inputs.seed_dry_run }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$SEED_DRY_RUN" == "true" ]]; then options+=(--dry-run); fi
          python tools/modsync-ci/seed_archives.py "${options[@]}"
      - name: Verify every pin restores with the read-only credentials
        if: ${{ !inputs.seed_dry_run }}
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: python tools/modsync-ci/seed_archives.py --verify

  p2p-loopback:
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve ModSync source repository
        id: source
        env:
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RUST_REPOSITORY" ]]; then
            echo "::error::The repository variable for the rust ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$RUST_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (rust)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null

      - name: Build modsync
        working-directory: .modsync-source
        run: cargo build --locked --bin modsync

      - name: Transfer a random archive between two peers on loopback
        run: python3 tools/modsync-ci/p2p_loopback.py --binary .modsync-source/target/debug/modsync

  install:
    name: install (${{ matrix.game }}, ${{ matrix.implementation }}, ${{ matrix.mode }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: read lets the
    # artifact-store tier list and download artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
        implementation: [rust, typescript]
        mode: [cli, gui]
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the reviewed TypeScript manifest
        if: matrix.implementation == 'typescript'
        run: |
          review="ci/${GAME}-typescript-review.json"
          if [[ ! -f "$review" ]]; then
            echo "::error::$review is missing. The TypeScript install lanes require a human-reviewed manifest and never pass without one."
            exit 1
          fi

      - name: Resolve ModSync source repository
        id: source
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          TYPESCRIPT_REPOSITORY: ${{ vars.MODSYNC_TS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$IMPLEMENTATION" == rust ]]; then repository="$RUST_REPOSITORY"; else repository="$TYPESCRIPT_REPOSITORY"; fi
          if [[ -z "$repository" ]]; then
            echo "::error::The repository variable for the $IMPLEMENTATION ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (${{ matrix.implementation }})
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ matrix.implementation == 'typescript' && env.MODSYNC_TS_REF || '' }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Restore the NSS script compiler cache
        id: nsscomp
        if: matrix.implementation == 'typescript'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nsscomp
          key: nsscomp-${{ runner.os }}-${{ env.NSSCOMP_REV }}

      - name: Let cargo fetch private git dependencies
        if: matrix.implementation == 'rust' || steps.nsscomp.outputs.cache-hit != 'true'
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Provide the NSS script compiler
        if: matrix.implementation == 'typescript'
        env:
          CACHE_HIT: ${{ steps.nsscomp.outputs.cache-hit }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nsscomp"
          if [[ "$CACHE_HIT" != true ]]; then
            cargo install --git https://github.com/holowan-biolabs/odynsscomp --rev "$NSSCOMP_REV" \
              bionsscomp-cli --root "$root" --locked
            git config --global --remove-section "url.https://x-access-token:${SOURCE_TOKEN}@github.com/"
          fi
          if [[ ! -x "$root/bin/bionsscomp" ]] || ! "$root/bin/bionsscomp" --version >/dev/null; then
            echo "::error::The NSS script compiler is missing or does not run; TypeScript CompileList steps cannot succeed."
            exit 1
          fi
          echo "MODSYNC_NSS_COMPILER=$root/bin/bionsscomp" >> "$GITHUB_ENV"
          echo "MODSYNC_NSS_GAME=$([[ "$GAME" == k1 ]] && echo 1 || echo 2)" >> "$GITHUB_ENV"

      - name: Save the NSS script compiler cache
        if: matrix.implementation == 'typescript' && steps.nsscomp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nsscomp
          key: ${{ steps.nsscomp.outputs.cache-primary-key }}

      - name: Install tools and free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
          packages=(p7zip-full pkg-config libssl-dev)
          if [[ '${{ matrix.mode }}' == gui ]]; then
            packages+=(xvfb xauth python3-tk tesseract-ocr tesseract-ocr-eng libxkbcommon-x11-dev
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev)
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - uses: actions/setup-node@v4
        if: matrix.implementation == 'typescript'
        with:
          node-version: '22'
      - name: Install ModSync.ts dependencies
        if: matrix.implementation == 'typescript'
        working-directory: .modsync-source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if [[ '${{ matrix.mode }}' == gui ]]; then corepack pnpm exec playwright install --with-deps chromium; fi
      - name: Install GUI driver
        if: matrix.mode == 'gui'
        run: |
          python -m pip install --quiet PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          python -c 'import sys, tkinter; print("GUI driver interpreter:", sys.executable, "tk", tkinter.TkVersion)' \
            || { echo "::error::tkinter is not importable by the interpreter that runs gui_rust.py (PyAutoGUI/MouseInfo needs it); python3-tk must match this python."; exit 1; }

      - name: Restore game cache
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: true
      - name: Explain a game cache miss
        if: failure() && steps.game_cache.outcome == 'failure'
        run: echo "::error::game cache evicted — re-run the game job (then this lane); see docs/ci.md, Actions cache size and eviction"
      - name: Unpack game
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Normalize game case
        run: |
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "${{ matrix.implementation }} ${{ matrix.mode }}"
      - name: Game inventory
        run: |
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" \
            --label "${{ matrix.implementation }} ${{ matrix.mode }}"
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ needs.mods.outputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Restore required mod archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          # Reviewed policy skips (docs/ci.md). ports.py leaves the skipped components out of
          # the install: Rust with --deselect, TypeScript with --select of the rest.
          policy=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
          if [[ "$GAME" == k1 ]]; then
            policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
          elif [[ "$GAME" == k2 ]]; then
            policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
          fi
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" --report "$RUNNER_TEMP/restore-report.json" \
            "${policy[@]}" "${remote[@]}"

      - name: Install Wine for legacy patchers and Execute
        if: matrix.implementation == 'typescript'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 >/dev/null

      - name: Install the full guide
        env:
          REVIEW: ci/${{ matrix.game }}-${{ matrix.implementation }}-review.json
          WINEDEBUG: '-all'
          WINEDLLOVERRIDES: 'mscoree,mshtml='
        run: |
          review=(--restore-report "$RUNNER_TEMP/restore-report.json")
          if [[ -f "$REVIEW" ]]; then review+=(--review-manifest "$REVIEW"); fi
          python tools/modsync-ci/ports.py \
            --implementation '${{ matrix.implementation }}' --mode '${{ matrix.mode }}' \
            --source .modsync-source --guide "content/$GAME/full.md" \
            --game-dir "$RUNNER_TEMP/game" --archives "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" \
            --work-dir "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report.json" "${review[@]}"

      - name: Seal lane diagnostics
        if: always()
        env:
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$DIAGNOSTICS_ENCRYPTION_KEY" ]]; then
            echo "::warning::DIAGNOSTICS_ENCRYPTION_KEY is not set; the lane report and convert log are not uploaded."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/diagnostics-plain" "$RUNNER_TEMP/diagnostics"
          if [[ -f "$RUNNER_TEMP/report.json" ]]; then cp -- "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/diagnostics-plain/"; fi
          for log in "$RUNNER_TEMP"/work/ports-*/convert.log; do
            if [[ -f "$log" ]]; then cp -- "$log" "$RUNNER_TEMP/diagnostics-plain/"; fi
          done
          CACHE_ENCRYPTION_KEY="$DIAGNOSTICS_ENCRYPTION_KEY" python tools/modsync-ci/seal.py seal \
            --source "$RUNNER_TEMP/diagnostics-plain" --destination "$RUNNER_TEMP/diagnostics/lane-diagnostics.seal"
      - name: Upload sealed lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ports-diagnostics-${{ matrix.game }}-${{ matrix.implementation }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/diagnostics/lane-diagnostics.seal
          retention-days: 7
          if-no-files-found: ignore

  manual:
    name: manual (${{ matrix.game }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A job-level block replaces the top-level one, so contents: read is repeated. actions: read lets the
    # artifact-store tier list and download artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      PLAN: ci/${{ matrix.game }}-manual-plan.json
      WINEPREFIX: /home/runner/.wine-modsync
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the reviewed manual plan
        id: plan
        run: |
          if [[ -f "$PLAN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=manual lane skipped::$PLAN is missing. The manual reference lane needs a human-reviewed, Wine-executed plan; it is non-gating and skipped without one. A draft is attached as manual-drafts-$GAME."
            {
              echo "### manual ($GAME)"
              echo "manual lane skipped: no reviewed plan; draft attached (artifact \`manual-drafts-$GAME\`). \`$PLAN\` must be authored and reviewed by a human; this lane never passes a game install without it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Draft the manual plan for review
        if: steps.plan.outputs.present == 'false'
        run: python3 tools/modsync-ci/draft_plan.py --game "$GAME" --out-dir "$RUNNER_TEMP/drafts"
      - name: Upload manual plan drafts
        if: ${{ !cancelled() && steps.plan.outputs.present == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-drafts-${{ matrix.game }}
          path: ${{ runner.temp }}/drafts
          retention-days: 14
          if-no-files-found: error
      - name: Install Wine and tools, free disk space
        if: steps.plan.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 xvfb xauth p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore game cache
        if: steps.plan.outputs.present == 'true'
        id: game_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: true
      - name: Explain a game cache miss
        if: failure() && steps.game_cache.outcome == 'failure'
        run: echo "::error::game cache evicted — re-run the game job (then this lane); see docs/ci.md, Actions cache size and eviction"
      - name: Unpack game
        if: steps.plan.outputs.present == 'true'
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Normalize game case
        if: steps.plan.outputs.present == 'true'
        run: |
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$RUNNER_TEMP/game" --label manual
      - name: Game inventory
        if: steps.plan.outputs.present == 'true'
        run: |
          python tools/modsync-ci/game_cache.py inventory --game "$GAME" --game-dir "$RUNNER_TEMP/game" --label manual
      - name: Install archive tools
        if: steps.plan.outputs.present == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore mod archive cache
        if: steps.plan.outputs.present == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ needs.mods.outputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Restore required mod archives
        if: steps.plan.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          remote=()
          if [[ -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID" && -n "$MOD_CACHE_BUCKET" ]]; then
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          fi
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            "${remote[@]}"
      - name: Install the full guide manually with the original patchers
        if: steps.plan.outputs.present == 'true'
        run: |
          xvfb-run -a python tools/modsync-ci/manual.py --plan "$PLAN" \
            --guide "content/$GAME/full.md" --game-dir "$RUNNER_TEMP/game" \
            --archives "$RUNNER_TEMP/archives" --work-dir "$RUNNER_TEMP/work" \
            --report "$RUNNER_TEMP/report.json"
      - name: Upload manual lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-report-${{ matrix.game }}
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: ignore
