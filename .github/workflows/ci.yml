name: CI

# One workflow for game acquisition, the mod archive cache and every install lane.
# Caches only make runs faster. A missing cache is refilled; the run fails only
# when a job cannot actually get the game or finish its install.
on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '!content/**', 'meta.json', 'docs/**']
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork pull requests get no secrets, so they skip every job (install jobs need game).
  game:
    name: game (${{ matrix.game }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1  # one Steam account
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      APP_ID: ${{ matrix.game == 'k1' && '32370' || '208580' }}
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look up game cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          lookup-only: true

      - name: Download game with SteamCMD
        if: steps.cache.outputs.cache-matched-key == ''
        timeout-minutes: 45
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          echo "::notice::Approve the Steam sign-in in the Steam mobile app if prompted."
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          # Each attempt sends a new approval request to the Steam mobile app.
          for _ in 1 2 3; do
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +@sSteamCmdForcePlatformType windows \
              +force_install_dir "$RUNNER_TEMP/game" \
              +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
              +app_update "$APP_ID" validate \
              +quit && test -f "$RUNNER_TEMP/game/chitin.key" && break
          done
          python tools/modsync-ci/game_cache.py pack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"

      - name: Save game cache
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1

  mods:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RCLONE_CONFIG_MODCACHE_TYPE: s3
      RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
      RCLONE_CONFIG_MODCACHE_REGION: auto
      RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
      MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install archive tools
        run: |
          sudo apt-get install -y -qq p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Download new or changed mod archives into the cache
        run: python tools/modsync-ci/refresh_archives.py --max-items 20

  install:
    name: install (${{ matrix.game }}, ${{ matrix.implementation }}, ${{ matrix.mode }})
    needs: [game, mods]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
        implementation: [rust, typescript]
        mode: [cli, gui]
    env:
      GAME: ${{ matrix.game }}
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
      RCLONE_CONFIG_MODCACHE_TYPE: s3
      RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
      RCLONE_CONFIG_MODCACHE_REGION: auto
      RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
      RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
      MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out ModSync (${{ matrix.implementation }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.implementation == 'rust' && vars.MODSYNC_RS_REPOSITORY || vars.MODSYNC_TS_REPOSITORY }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Install tools and free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
          packages=(p7zip-full pkg-config libssl-dev)
          if [[ '${{ matrix.mode }}' == gui ]]; then
            packages+=(xvfb xauth tesseract-ocr tesseract-ocr-eng libxkbcommon-x11-dev
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev)
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - uses: actions/setup-node@v4
        if: matrix.implementation == 'typescript'
        with:
          node-version: '22'
      - name: Install ModSync.ts dependencies
        if: matrix.implementation == 'typescript'
        working-directory: .modsync-source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if [[ '${{ matrix.mode }}' == gui ]]; then corepack pnpm exec playwright install --with-deps chromium; fi
      - name: Install GUI driver
        if: matrix.mode == 'gui'
        run: python -m pip install --quiet PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0

      - name: Restore game cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
      - name: Unpack game and mod archives
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives"

      - name: Install the full guide
        env:
          REVIEW: ci/${{ matrix.game }}-${{ matrix.implementation }}-review.json
        run: |
          review=(); if [[ -f "$REVIEW" ]]; then review=(--review-manifest "$REVIEW"); fi
          python tools/modsync-ci/ports.py \
            --implementation '${{ matrix.implementation }}' --mode '${{ matrix.mode }}' \
            --source .modsync-source --guide "content/$GAME/full.md" \
            --game-dir "$RUNNER_TEMP/game" --archives "$RUNNER_TEMP/archives" \
            --work-dir "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report.json" "${review[@]}"

  manual:
    name: manual (${{ matrix.game }})
    needs: [game, mods]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      PLAN: ci/${{ matrix.game }}-manual-plan.json
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
      RCLONE_CONFIG_MODCACHE_TYPE: s3
      RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
      RCLONE_CONFIG_MODCACHE_REGION: auto
      RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
      RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
      MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
      WINEPREFIX: /home/runner/.wine-modsync
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed manual plan
        run: test -f "$PLAN" || { echo "::error::Missing $PLAN (human-reviewed manual install plan)."; exit 1; }
      - name: Install Wine and tools, free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 xvfb xauth p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore game cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
      - name: Unpack game and mod archives
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives"
      - name: Install the full guide manually with the original patchers
        run: |
          xvfb-run -a python tools/modsync-ci/manual.py --plan "$PLAN" \
            --guide "content/$GAME/full.md" --game-dir "$RUNNER_TEMP/game" \
            --archives "$RUNNER_TEMP/archives" --work-dir "$RUNNER_TEMP/work" \
            --report "$RUNNER_TEMP/report.json"
