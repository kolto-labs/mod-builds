name: CI

# One workflow for game acquisition, the mod archive cache and every install lane.
# Caches only make runs faster. A missing cache is refilled; the run fails only
# when a job cannot actually get the game or finish its install.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', 'meta.json', 'README.md']
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
    inputs:
      seed_archives:
        description: Seed the archive cache from the staging remote (dev only; skips every other job)
        type: boolean
        default: false
      seed_dry_run:
        description: Seed only - verify every staged file against its pin but write nothing to the cache
        type: boolean
        default: false

permissions:
  contents: read

env:
  # ModSync.ts ref the typescript install lanes build. Physical install
  # (--ci-physical-install) exists only on this branch, not on the repository default branch.
  MODSYNC_TS_REF: ${{ vars.MODSYNC_TS_REF || 'feat/physical-install' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fork and dependabot pull requests get no secrets, so they skip every job (install jobs need game).
  game:
    name: game (${{ matrix.game }})
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1  # one Steam account
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      APP_ID: ${{ matrix.game == 'k1' && '32370' || '208580' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look up game cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          lookup-only: true

      - name: Download game with SteamCMD
        if: steps.cache.outputs.cache-matched-key == ''
        timeout-minutes: 45
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_GUARD_CODES: ${{ secrets.STEAM_GUARD_CODES }}  # optional: whitespace-separated Steam Guard backup codes
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$RUNNER_TEMP/steamcmd"
          steamcmd="$RUNNER_TEMP/steamcmd/steamcmd.sh"
          "$steamcmd" +quit </dev/null >/dev/null
          options=(+@ShutdownOnFailedCommand 1 +@sSteamCmdForcePlatformType windows
            +force_install_dir "$RUNNER_TEMP/game")
          install=(+app_update "$APP_ID" validate +quit)
          if [[ -n "$STEAM_CONFIG_VDF" ]]; then
            umask 077
            mkdir -p "$HOME/Steam/config"
            printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"
            "$steamcmd" "${options[@]}" +@NoPromptForPassword 1 +login "$STEAM_USERNAME" "${install[@]}" </dev/null || true
          fi
          if [[ ! -f "$RUNNER_TEMP/game/chitin.key" ]]; then
            printf '%s\n' "$STEAM_PASSWORD" | "$steamcmd" "${options[@]}" +login "$STEAM_USERNAME" "${install[@]}" || true
          fi
          # Fallback: Steam Guard backup codes (each is single-use; spent codes are rejected quickly).
          for code in $STEAM_GUARD_CODES; do
            [[ -f "$RUNNER_TEMP/game/chitin.key" ]] && break
            echo "Trying a Steam Guard backup code."
            "$steamcmd" "${options[@]}" +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "$code" "${install[@]}" </dev/null || true
          done
          test -f "$RUNNER_TEMP/game/chitin.key"
          python tools/modsync-ci/game_cache.py pack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"

      - name: Save game cache
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1

  mods:
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    continue-on-error: true  # a stale archive cache must never block the install lanes
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Download new or changed mod archives into the cache
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: python tools/modsync-ci/refresh_archives.py --max-items 500

  # Manual only: copies hand-downloaded archives from the private STAGING rclone remote into the
  # R2 cache, one file at a time, after verifying each against its reviewed pin (seed_pins.json).
  # A dispatch with seed_archives skips every other job; the shared concurrency group serializes
  # this with the scheduled refresh so the two never write the manifest at once.
  seed:
    name: seed archive cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_archives }}
    environment: mod-cache-seed
    concurrency:
      group: mod-cache-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP" | tail -n 1
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Seed archives from staging (verified against the pins)
        env:
          SEED_STAGING_RCLONE_CONF_B64: ${{ secrets.SEED_STAGING_RCLONE_CONF_B64 }}
          SEED_DRY_RUN: ${{ inputs.seed_dry_run }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$SEED_DRY_RUN" == "true" ]]; then options+=(--dry-run); fi
          python tools/modsync-ci/seed_archives.py "${options[@]}"
      - name: Verify every pin restores with the read-only credentials
        if: ${{ !inputs.seed_dry_run }}
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: python tools/modsync-ci/seed_archives.py --verify

  p2p-loopback:
    if: ${{ !inputs.seed_archives && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve ModSync source repository
        id: source
        env:
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RUST_REPOSITORY" ]]; then
            echo "::error::The repository variable for the rust ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$RUST_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (rust)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null

      - name: Build modsync
        working-directory: .modsync-source
        run: cargo build --locked --bin modsync

      - name: Transfer a random archive between two peers on loopback
        run: python3 tools/modsync-ci/p2p_loopback.py --binary .modsync-source/target/debug/modsync

  install:
    name: install (${{ matrix.game }}, ${{ matrix.implementation }}, ${{ matrix.mode }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
        implementation: [rust, typescript]
        mode: [cli, gui]
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the reviewed TypeScript manifest
        if: matrix.implementation == 'typescript'
        run: |
          review="ci/${GAME}-typescript-review.json"
          if [[ ! -f "$review" ]]; then
            echo "::error::$review is missing. The TypeScript install lanes require a human-reviewed manifest and never pass without one."
            exit 1
          fi

      - name: Resolve ModSync source repository
        id: source
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}
          RUST_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          TYPESCRIPT_REPOSITORY: ${{ vars.MODSYNC_TS_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$IMPLEMENTATION" == rust ]]; then repository="$RUST_REPOSITORY"; else repository="$TYPESCRIPT_REPOSITORY"; fi
          if [[ -z "$repository" ]]; then
            echo "::error::The repository variable for the $IMPLEMENTATION ModSync source is empty."
            exit 1
          fi
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::MODSYNC_SOURCE_TOKEN is empty."
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Check out ModSync (${{ matrix.implementation }})
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ matrix.implementation == 'typescript' && env.MODSYNC_TS_REF || '' }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-source
          persist-credentials: false

      - name: Let cargo fetch private git dependencies
        if: matrix.implementation == 'rust'
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SOURCE_TOKEN"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install tools and free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
          packages=(p7zip-full pkg-config libssl-dev)
          if [[ '${{ matrix.mode }}' == gui ]]; then
            packages+=(xvfb xauth tesseract-ocr tesseract-ocr-eng libxkbcommon-x11-dev
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev)
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}" >/dev/null

      - uses: actions/setup-node@v4
        if: matrix.implementation == 'typescript'
        with:
          node-version: '22'
      - name: Install ModSync.ts dependencies
        if: matrix.implementation == 'typescript'
        working-directory: .modsync-source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if [[ '${{ matrix.mode }}' == gui ]]; then corepack pnpm exec playwright install --with-deps chromium; fi
      - name: Install GUI driver
        if: matrix.mode == 'gui'
        run: python -m pip install --quiet PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0

      - name: Restore game cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: true
      - name: Unpack game
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore required mod archives
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set +e
          # Reviewed policy skips (docs/ci.md). Rust lanes only: ports.py deselects
          # the skipped component; the TypeScript lanes have no deselect mechanism.
          policy=()
          if [[ '${{ matrix.implementation }}' == rust ]]; then
            policy+=(--allow-uncached-by-policy "Optional Install Assistant - Quicker TSLPatching::Quicker TSLPatching")
            if [[ "$GAME" == k1 ]]; then
              policy+=(--allow-uncached-by-policy "Optional Widescreen & Extended Widescreen Support Mods::Remastered Cutscenes")
            elif [[ "$GAME" == k2 ]]; then
              policy+=(--allow-uncached-by-policy "Enhanced Widescreen Support Mods::K2 Cutscenes Rescaled")
            fi
          fi
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" --report "$RUNNER_TEMP/restore-report.json" \
            "${policy[@]}" \
            --remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives"
          remote_status=$?
          if [[ "$remote_status" -ne 0 ]]; then
            echo "::warning::R2 restore or repair persistence failed; retrying from the local verified cache."
            python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
              --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
              --archive-map "$RUNNER_TEMP/archive-map.json" --report "$RUNNER_TEMP/restore-report.json" \
              "${policy[@]}"
            local_status=$?
            if [[ "$local_status" -ne 0 ]]; then exit "$local_status"; fi
          fi

      - name: Install the full guide
        env:
          REVIEW: ci/${{ matrix.game }}-${{ matrix.implementation }}-review.json
        run: |
          review=(); if [[ -f "$REVIEW" ]]; then review=(--review-manifest "$REVIEW"); fi
          if [[ '${{ matrix.implementation }}' == rust ]]; then review+=(--restore-report "$RUNNER_TEMP/restore-report.json"); fi
          python tools/modsync-ci/ports.py \
            --implementation '${{ matrix.implementation }}' --mode '${{ matrix.mode }}' \
            --source .modsync-source --guide "content/$GAME/full.md" \
            --game-dir "$RUNNER_TEMP/game" --archives "$RUNNER_TEMP/archives" \
            --archive-map "$RUNNER_TEMP/archive-map.json" \
            --work-dir "$RUNNER_TEMP/work" --report "$RUNNER_TEMP/report.json" "${review[@]}"

      - name: Seal lane diagnostics
        if: always()
        env:
          DIAGNOSTICS_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$DIAGNOSTICS_ENCRYPTION_KEY" ]]; then
            echo "::warning::DIAGNOSTICS_ENCRYPTION_KEY is not set; the lane report and convert log are not uploaded."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/diagnostics-plain" "$RUNNER_TEMP/diagnostics"
          if [[ -f "$RUNNER_TEMP/report.json" ]]; then cp -- "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/diagnostics-plain/"; fi
          for log in "$RUNNER_TEMP"/work/ports-*/convert.log; do
            if [[ -f "$log" ]]; then cp -- "$log" "$RUNNER_TEMP/diagnostics-plain/"; fi
          done
          CACHE_ENCRYPTION_KEY="$DIAGNOSTICS_ENCRYPTION_KEY" python tools/modsync-ci/seal.py seal \
            --source "$RUNNER_TEMP/diagnostics-plain" --destination "$RUNNER_TEMP/diagnostics/lane-diagnostics.seal"
      - name: Upload sealed lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ports-diagnostics-${{ matrix.game }}-${{ matrix.implementation }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/diagnostics/lane-diagnostics.seal
          retention-days: 7
          if-no-files-found: ignore

  manual:
    name: manual (${{ matrix.game }})
    needs: [game, mods]
    # Run per game even if the other game failed; unpacking fails if this game is missing.
    if: ${{ !cancelled() && needs.game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        game: [k1, k2]
    env:
      GAME: ${{ matrix.game }}
      PLAN: ci/${{ matrix.game }}-manual-plan.json
      WINEPREFIX: /home/runner/.wine-modsync
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the reviewed manual plan
        run: |
          if [[ ! -f "$PLAN" ]]; then
            echo "::error::$PLAN is missing. The manual reference lane requires a human-reviewed plan and never passes without one."
            exit 1
          fi
      - name: Install Wine and tools, free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 xvfb xauth p7zip-full >/dev/null
          python3 tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Restore game cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ matrix.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-Linux-
          fail-on-cache-miss: true
      - name: Unpack game
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          python tools/modsync-ci/game_cache.py unpack --game "$GAME" \
            --game-dir "$RUNNER_TEMP/game" --seal "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Install archive tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 7zip-rar megatools libarchive-tools >/dev/null && { sudo apt-get install -y -qq unrar >/dev/null 2>&1 || echo "unrar unavailable; falling back to 7z/bsdtar"; }
          python -m pip install --quiet gdown
      - name: Restore required mod archives
        env:
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set +e
          python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
            --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives" \
            --remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives"
          remote_status=$?
          if [[ "$remote_status" -ne 0 ]]; then
            echo "::warning::R2 restore or repair persistence failed; retrying from the local verified cache."
            python tools/modsync-ci/cache.py restore --guide "content/$GAME/full.md" \
              --cache-dir "$RUNNER_TEMP/mod-cache" --destination "$RUNNER_TEMP/archives"
            local_status=$?
            if [[ "$local_status" -ne 0 ]]; then exit "$local_status"; fi
          fi
      - name: Install the full guide manually with the original patchers
        run: |
          xvfb-run -a python tools/modsync-ci/manual.py --plan "$PLAN" \
            --guide "content/$GAME/full.md" --game-dir "$RUNNER_TEMP/game" \
            --archives "$RUNNER_TEMP/archives" --work-dir "$RUNNER_TEMP/work" \
            --report "$RUNNER_TEMP/report.json"
