name: ModSync manual reference install

on:
  workflow_dispatch:
    inputs:
      game:
        type: choice
        options: [k1, k2]
        required: true
        default: k1
      plan:
        description: 'Required repository-relative committed human-reviewed plan for the selected guide'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: modsync-manual-${{ inputs.game }}
  cancel-in-progress: false

jobs:
  manual:
    if: github.repository == 'kolto-labs/mod-builds' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ inputs.game }}
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Require trusted dispatcher and disable diagnostic logging
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.actor }}
          REEXECUTOR: ${{ github.triggering_actor }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          if any(os.environ.get(key, '').lower() in ('1', 'true', 'yes', 'on')
                 for key in ('RUNNER_DEBUG', 'ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG')):
              sys.exit('Debug logging is not permitted.')
          if os.environ['GAME'] not in ('k1', 'k2'):
              sys.exit('Invalid game.')
          if os.environ['REEXECUTOR'] != os.environ['DISPATCHER']:
              sys.exit('Reruns must use the original trusted dispatcher.')
          result = subprocess.run(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] +
                                   '/collaborators/' + os.environ['DISPATCHER'] + '/permission'],
                                  capture_output=True, text=True)
          if result.returncode or json.loads(result.stdout).get('permission') not in ('admin', 'maintain', 'write'):
              sys.exit('A trusted repository dispatcher is required.')
          PY

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Preflight committed reviewed plan before downloads
        id: preflight
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os, re, runpy, subprocess, sys
          from pathlib import Path, PurePosixPath
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-manual-private'
          private.mkdir(mode=0o700)
          value = os.environ.get('PLAN', '')
          path = PurePosixPath(value)
          def blocked():
              sys.exit('Blocked: supply an existing committed reviewed plan via the plan input; no plan is generated.')
          if (not value or path.is_absolute() or path.as_posix() != value
              or any(part in ('.', '..') or part.startswith('.') for part in path.parts)
              or not re.fullmatch(r'[A-Za-z0-9_./-]+', value)):
              blocked()
          result = subprocess.run(['git', 'ls-tree', 'HEAD', '--', value], capture_output=True)
          if result.returncode or not result.stdout.startswith((b'100644 blob ', b'100755 blob ')):
              blocked()
          result = subprocess.run(['git', 'show', 'HEAD:' + value], capture_output=True)
          if result.returncode:
              blocked()
          plan = private / 'reviewed-plan.json'
          plan.write_bytes(result.stdout)
          plan.chmod(0o400)
          try:
              contract = runpy.run_path('tools/modsync-ci/manual.py')
              roots = {'game': private / 'game', 'archives': private / 'archives',
                       'extract': private / 'work' / 'extract'}
              contract['validate_plan'](contract['read_plan'](plan),
                  Path('content') / os.environ['GAME'] / 'full.md', roots, 1800)
          except Exception:
              sys.exit('Blocked: committed plan failed manual.py validation for the selected guide; review its hash, coverage and operations.')
          PY

      - name: Install Wine and isolated display dependencies
        run: |
          set -euo pipefail
          umask 077
          {
            sudo dpkg --add-architecture i386
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386 xvfb xauth p7zip-full rclone
          } > "$RUNNER_TEMP/modsync-manual-private/runtime-dependencies.log" 2>&1

      - name: Restore encrypted baseline cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/sealed/baseline.seal
          key: steam-sealed-v2-${{ inputs.game }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-sealed-v2-${{ inputs.game }}-${{ runner.os }}-
          fail-on-cache-miss: true

      - name: Authenticate baseline and create independent install copy
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python tools/modsync-ci/seal.py unseal --source "$RUNNER_TEMP/sealed/baseline.seal" --destination "$RUNNER_TEMP/modsync-manual-private/baseline" > "$RUNNER_TEMP/modsync-manual-private/baseline.log" 2>&1
          python - <<'PY'
          import json, os, runpy, shutil, time
          from pathlib import Path
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-manual-private'
          restored = private / 'baseline'
          interval = 14 * 86400
          age = time.time() - float((restored / 'refreshed-at').read_text())
          if not 0 <= age < interval:
              raise SystemExit('Baseline expired; run Steam acquisition first.')
          contract = runpy.run_path('tools/private-ci/src/steam_acquire.py')
          baseline = restored / ('baseline-' + os.environ['GAME'])
          receipt = json.loads((restored / ('baseline-' + os.environ['GAME'] + '.json')).read_text())
          if not receipt or contract['inventory'](baseline) != receipt:
              raise SystemExit('Baseline inventory verification failed.')
          shutil.copytree(baseline, private / 'game', ignore=shutil.ignore_patterns('steamapps'))
          if contract['inventory'](private / 'game') != receipt:
              raise SystemExit('Independent game copy verification failed.')
          PY

      - name: Restore encrypted archive cache fallback
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/modsync-archives-sealed/archives.seal
          key: modsync-archives-sealed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: modsync-archives-sealed-v1-

      - name: Restore verified mod archives with read-only backend
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-manual-private"
          remote=()
          if test -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID"; then
            test -n "$RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY"
            test -n "$RCLONE_CONFIG_MODCACHE_ENDPOINT"
            test -n "$MOD_CACHE_BUCKET"
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          else
            test -f "$RUNNER_TEMP/modsync-archives-sealed/archives.seal"
            python tools/modsync-ci/seal.py unseal --source "$RUNNER_TEMP/modsync-archives-sealed/archives.seal" --destination "$private/mod-cache"
          fi
          mkdir -p "$private/archives"
          python tools/modsync-ci/cache.py restore --cache-dir "$private/mod-cache" --guide "content/$GAME/full.md" --destination "$private/archives" --report "$private/cache-report.json" "${remote[@]}" > "$private/cache.log" 2>&1

      - name: Run reviewed manual plan with original patchers
        id: execute
        env:
          WINEPREFIX: ${{ runner.temp }}/modsync-manual-private/wine
          WINEDEBUG: '-all'
          WINEDLLOVERRIDES: 'mscoree,mshtml='
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-manual-private"
          xvfb-run -a python tools/modsync-ci/manual.py \
            --plan "$private/reviewed-plan.json" \
            --guide "$GITHUB_WORKSPACE/content/$GAME/full.md" \
            --game-dir "$private/game" --archives "$private/archives" \
            --work-dir "$private/work" --report "$private/manual-report.json" \
            > "$private/manual.log" 2>&1

      - name: Produce sanitized status only
        if: always() && steps.trust.outcome == 'success'
        env:
          EXECUTOR_OUTCOME: ${{ steps.execute.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          os.umask(0o077)
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-manual-private'
          report = {'game': os.environ['GAME'], 'status': 'blocked',
                    'reason': 'prerequisite_or_execution_failed'}
          if os.environ['PREFLIGHT_OUTCOME'] != 'success':
              report['reason'] = 'committed_reviewed_plan_preflight_failed'
          path = private / 'manual-report.json'
          if path.is_file() and not path.is_symlink():
              try:
                  data = json.loads(path.read_bytes())
                  if (isinstance(data, dict) and data.get('status') == 'complete'
                      and os.environ['EXECUTOR_OUTCOME'] == 'success'):
                      report.update(status='complete', reason='reviewed_manual_plan_completed')
              except (ValueError, OSError):
                  pass
          output = Path(os.environ['RUNNER_TEMP']) / 'modsync-manual-sanitized'
          output.mkdir(mode=0o700)
          (output / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Manual reference: ' + report['status'] + '; ' + report['reason'] + '\n')
          PY

      - name: Upload sanitized status only
        if: always() && steps.trust.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modsync-manual-${{ inputs.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modsync-manual-sanitized/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private game archives plans and diagnostics
        if: always() && steps.trust.outcome == 'success'
        run: |
          rm -rf "$RUNNER_TEMP/modsync-manual-private" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/modsync-archives-sealed"

