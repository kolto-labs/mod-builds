name: Refresh private mod cache
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Bypass the 14-day successful-refresh interval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-mod-cache-refresh-${{ github.repository }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Guard trusted execution and disable debug disclosure
        id: preflight
        shell: python
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_CACHE_FORCE: ${{ inputs.force || false }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: |
          import os, pathlib, sys
          debug = any(os.environ.get(key, '').lower() in ('1', 'true', 'yes', 'on') for key in ('RUNNER_DEBUG', 'ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG'))
          trusted = os.environ['CI_REPOSITORY'] == 'kolto-labs/mod-builds' and os.environ['CI_EVENT'] in ('schedule', 'workflow_dispatch')
          if debug or not trusted or os.environ['CI_CACHE_FORCE'].lower() not in ('true', 'false'):
              sys.exit('Private cache preflight rejected the configuration.')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cache-encrypted-receipts'
          if output.is_symlink() or (output.exists() and not output.is_dir()):
              sys.exit('Private cache preflight rejected the receipt directory.')
          output.mkdir(mode=0o700, exist_ok=True)
          for path in output.iterdir():
              if path.is_symlink() or not path.is_file() or path.suffix != '.age':
                  sys.exit('Private cache preflight rejected the receipt directory.')
              path.unlink()
          print('Private cache preflight ready.')
      - name: Checkout current public guides and trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kolto-labs/mod-builds
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned receipt encryption tool
        shell: bash
        run: python tools/private-ci/src/bootstrap_age.py --directory "$RUNNER_TEMP/age"
      - name: Refresh immutable private cache generation
        shell: python
        env:
          FULL_BUILD_CONFIG: ${{ secrets.FULL_BUILD_CONFIG }}
          PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
          PRIVATE_CI_RECIPIENT: ${{ secrets.PRIVATE_CI_RECIPIENT }}
          CACHE_WRITER_ACCESS_KEY_ID: ${{ secrets.CACHE_WRITER_ACCESS_KEY_ID }}
          CACHE_WRITER_SECRET_ACCESS_KEY: ${{ secrets.CACHE_WRITER_SECRET_ACCESS_KEY }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          CI_CACHE_FORCE: ${{ inputs.force || false }}
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          command = [sys.executable, 'tools/private-ci/src/cache_refresh.py', '--output', str(temporary / 'cache-encrypted-receipts'), '--age', str(temporary / 'age' / 'age')]
          if os.environ['CI_CACHE_FORCE'].lower() == 'true':
              command.append('--force')
          sys.exit(subprocess.run(command).returncode)
      - name: Find encrypted refresh receipts
        id: evidence
        if: always() && steps.preflight.outcome == 'success'
        shell: python
        run: |
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cache-encrypted-receipts'
          present = output.is_dir() and any(path.is_file() and not path.is_symlink() for path in output.glob('*.age'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('present=' + str(present).lower() + '\n')
      - name: Retain encrypted receipts only
        if: always() && steps.preflight.outcome == 'success' && steps.evidence.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-cache-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-encrypted-receipts/*.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
