name: ModSync full guide install

on:
  workflow_call:
    inputs:
      game:
        type: string
        default: k1
        required: true
      mode:
        type: string
        default: cli
        required: true
      implementation:
        type: string
        default: rust
        required: true
      review-manifest:
        description: 'Optional repository-relative reviewed manifest file at this commit; installation fails if omitted'
        type: string
        required: false
    secrets:
      ACTIONS_STEP_DEBUG:
        required: false
      ACTIONS_RUNNER_DEBUG:
        required: false
      MODSYNC_SOURCE_TOKEN:
        required: true
      CACHE_ENCRYPTION_KEY:
        required: true
      MOD_CACHE_S3_READ_ACCESS_KEY_ID:
        required: false
      MOD_CACHE_S3_READ_SECRET_ACCESS_KEY:
        required: false
      MOD_CACHE_S3_ENDPOINT:
        required: false
  workflow_dispatch:
    inputs:
      game:
        type: choice
        options: [k1, k2]
        default: k1
        required: true
      mode:
        type: choice
        options: [cli, gui]
        default: cli
        required: true
      implementation:
        type: choice
        options: [rust, typescript]
        default: rust
        required: true
      review-manifest:
        description: 'Optional repository-relative reviewed manifest file at this commit; installation fails if omitted'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: modsync-install-${{ inputs.game }}-${{ inputs.mode }}-${{ inputs.implementation }}
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'kolto-labs/mod-builds' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GAME: ${{ inputs.game }}
      MODE: ${{ inputs.mode }}
      IMPLEMENTATION: ${{ inputs.implementation }}
      REVIEW_MANIFEST: ${{ inputs.review-manifest }}
    steps:
      - name: Require trusted dispatcher and disable diagnostic logging
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.actor }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          if any(os.environ.get(key, '').lower() in ('1', 'true', 'yes', 'on')
                 for key in ('RUNNER_DEBUG', 'ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG')):
              sys.exit('Debug logging is not permitted.')
          if (os.environ['GAME'] not in ('k1', 'k2') or
              os.environ['MODE'] not in ('cli', 'gui') or
              os.environ['IMPLEMENTATION'] not in ('rust', 'typescript')):
              sys.exit('Invalid dispatch configuration.')
          result = subprocess.run(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] +
                                   '/collaborators/' + os.environ['DISPATCHER'] + '/permission'],
                                  capture_output=True, text=True)
          if result.returncode or json.loads(result.stdout).get('permission') not in ('admin', 'maintain', 'write'):
              sys.exit('A trusted repository dispatcher is required.')
          PY

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve private source to immutable commit
        id: source
        env:
          GH_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          MODSYNC_RS_REPOSITORY: ${{ vars.MODSYNC_RS_REPOSITORY }}
          MODSYNC_TS_REPOSITORY: ${{ vars.MODSYNC_TS_REPOSITORY }}
          MODSYNC_RS_REF: ${{ vars.MODSYNC_RS_REF }}
          MODSYNC_TS_REF: ${{ vars.MODSYNC_TS_REF }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          from urllib.parse import quote
          prefix = 'MODSYNC_RS' if os.environ['IMPLEMENTATION'] == 'rust' else 'MODSYNC_TS'
          repository = os.environ[prefix + '_REPOSITORY']
          ref = os.environ[prefix + '_REF']
          def api(endpoint):
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if result.returncode:
                  sys.exit('Private source resolution failed.')
              return json.loads(result.stdout)
          if not os.environ['GH_TOKEN'] or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              sys.exit('Configure the private source repository variable and source token.')
          metadata = api('repos/' + repository)
          if metadata.get('private') is not True:
              sys.exit('Source checkout must be private.')
          if ref and not re.fullmatch(r'[a-fA-F0-9]{40}', ref):
              sys.exit('Configured source refs must be immutable full commit SHAs.')
          sha = api('repos/' + repository + '/commits/' + quote(ref or metadata['default_branch'], safe=''))['sha']
          if not re.fullmatch(r'[a-f0-9]{40}', sha) or (ref and sha.lower() != ref.lower()):
              sys.exit('Source commit verification failed.')
          os.umask(0o077)
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-install-private'
          private.mkdir(mode=0o700)
          (private / 'source-sha').write_text(sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + repository + '\nsha=' + sha + '\n')
          PY

      - name: Checkout pinned private implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          path: .modsync-private-source
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-install-private"
          packages=(p7zip-full rclone)
          if [[ "$IMPLEMENTATION" == rust ]]; then
            packages+=(pkg-config libssl-dev)
          fi
          if [[ "$MODE" == gui ]]; then
            packages+=(xvfb xauth tesseract-ocr tesseract-ocr-eng
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev
              libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev
              libgl1-mesa-dev libegl1-mesa-dev libwayland-dev)
          fi
          {
          sudo apt-get update -qq
          sudo apt-get install -y "${packages[@]}"
          } > "$private/runtime-dependencies.log" 2>&1

      - name: Install isolated GUI driver Python dependencies
        if: inputs.mode == 'gui'
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-install-private"
          {
            python -m venv "$private/gui-venv"
            "$private/gui-venv/bin/python" -m pip install --disable-pip-version-check \
              PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          } > "$private/gui-dependencies.log" 2>&1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.implementation == 'typescript'
        with:
          node-version: '22'

      - name: Install private TypeScript dependencies
        if: inputs.implementation == 'typescript'
        run: |
          set -euo pipefail
          umask 077
          cd .modsync-private-source
          corepack enable > "$RUNNER_TEMP/modsync-install-private/corepack.log" 2>&1
          corepack pnpm install --frozen-lockfile > "$RUNNER_TEMP/modsync-install-private/dependencies.log" 2>&1

      - name: Restore encrypted baseline cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/sealed/baseline.seal
          key: steam-sealed-v2-${{ inputs.game }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-sealed-v2-${{ inputs.game }}-${{ runner.os }}-
          fail-on-cache-miss: true

      - name: Authenticate baseline and create independent install copy
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python tools/modsync-ci/seal.py unseal --source "$RUNNER_TEMP/sealed/baseline.seal" --destination "$RUNNER_TEMP/modsync-install-private/baseline"
          python - <<'PY'
          import json, os, runpy, shutil, time
          from pathlib import Path
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-install-private'
          restored = private / 'baseline'
          interval = 14 * 86400
          age = time.time() - float((restored / 'refreshed-at').read_text())
          if not 0 <= age < interval:
              raise SystemExit('Baseline expired; run Steam acquisition first.')
          contract = runpy.run_path('tools/private-ci/src/steam_acquire.py')
          baseline = restored / ('baseline-' + os.environ['GAME'])
          receipt = json.loads((restored / ('baseline-' + os.environ['GAME'] + '.json')).read_text())
          if not receipt or contract['inventory'](baseline) != receipt:
              raise SystemExit('Baseline inventory verification failed.')
          shutil.copytree(baseline, private / 'game', ignore=shutil.ignore_patterns('steamapps'))
          if contract['inventory'](private / 'game') != receipt:
              raise SystemExit('Independent game copy verification failed.')
          PY

      - name: Restore encrypted archive cache fallback
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/modsync-archives-sealed/archives.seal
          key: modsync-archives-sealed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: modsync-archives-sealed-v1-

      - name: Restore verified mod archives with read-only backend
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-install-private"
          remote=()
          if test -n "$RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID"; then
            test -n "$RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY"
            test -n "$RCLONE_CONFIG_MODCACHE_ENDPOINT"
            test -n "$MOD_CACHE_BUCKET"
            remote=(--remote "MODCACHE:$MOD_CACHE_BUCKET/modsync-archives")
          else
            test -f "$RUNNER_TEMP/modsync-archives-sealed/archives.seal"
            python tools/modsync-ci/seal.py unseal --source "$RUNNER_TEMP/modsync-archives-sealed/archives.seal" --destination "$private/mod-cache"
          fi
          mkdir -p "$private/archives"
          python tools/modsync-ci/cache.py restore --cache-dir "$private/mod-cache" --guide "content/$GAME/full.md" --destination "$private/archives" --report "$private/cache-report.json" "${remote[@]}" > "$private/cache.log" 2>&1

      - name: Require immutable review manifest before adapter execution
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path, PurePosixPath
          os.umask(0o077)
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-install-private'
          def blocked():
              (private / 'ports-report.json').write_text(json.dumps({
                  'status': 'blocked', 'reason': 'immutable_review_manifest_not_provided',
              }) + '\n')
              sys.exit('Blocked: supply --review-manifest as a tracked regular repository file at this commit.')
          value = os.environ.get('REVIEW_MANIFEST', '')
          path = PurePosixPath(value)
          if (not value or path.is_absolute() or path.as_posix() != value
              or any(part in ('.', '..') or part.startswith('.') for part in path.parts)
              or any(character not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-/.' for character in value)):
              blocked()
          result = subprocess.run(['git', 'ls-tree', 'HEAD', '--', value], capture_output=True)
          if result.returncode or not result.stdout.startswith((b'100644 blob ', b'100755 blob ')):
              blocked()
          result = subprocess.run(['git', 'show', 'HEAD:' + value], capture_output=True)
          if result.returncode:
              blocked()
          (private / 'review-manifest.json').write_bytes(result.stdout)
          PY

      - name: Convert real guide and run fail-closed adapter
        id: ports
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/modsync-install-private"
          interpreter=python
          if [[ "$MODE" == gui ]]; then
            interpreter="$private/gui-venv/bin/python"
          fi
          test -f "$private/review-manifest.json"
          "$interpreter" tools/modsync-ci/ports.py --implementation "$IMPLEMENTATION" --mode "$MODE" --source "$GITHUB_WORKSPACE/.modsync-private-source" --guide "$GITHUB_WORKSPACE/content/$GAME/full.md" --game-dir "$private/game" --archives "$private/archives" --work-dir "$private/work" --report "$private/ports-report.json" --review-manifest "$private/review-manifest.json" > "$private/ports.log" 2>&1

      - name: Produce allowlisted sanitized status
        if: always() && steps.trust.outcome == 'success'
        env:
          ADAPTER_OUTCOME: ${{ steps.ports.outcome }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          private = Path(os.environ['RUNNER_TEMP']) / 'modsync-install-private'
          report = {'game': os.environ['GAME'], 'mode': os.environ['MODE'],
                    'implementation': os.environ['IMPLEMENTATION'],
                    'status': 'blocked', 'reason': 'prerequisite_or_adapter_failed'}
          source = private / 'source-sha'
          if source.is_file() and re.fullmatch('[a-f0-9]{40}', source.read_text()):
              report['source_sha'] = source.read_text()
          path = private / 'ports-report.json'
          if path.is_file() and not path.is_symlink():
              try:
                  data = json.loads(path.read_text())
              except (ValueError, OSError):
                  data = {}
              reasons = {'native_install_command_succeeded', 'native_install_commands_succeeded',
                         'real_full_guide_gui_driver_unavailable',
                         'typescript_unattended_review_and_full_phase_driver_unavailable',
                         'build_failed', 'convert_failed', 'validate_failed', 'install_failed',
                         'guide_component_coverage_mismatch', 'guide_steps_without_instructions',
                         'command_interrupted_or_timed_out', 'input_tool_or_document_error',
                         'immutable_review_manifest_not_provided'}
              if data.get('reason') in reasons:
                  report['reason'] = data['reason']
              if (os.environ['ADAPTER_OUTCOME'] == 'success' and data.get('status') == 'installed'
                  and data.get('reason') in ('native_install_command_succeeded', 'native_install_commands_succeeded')):
                  report['status'] = 'installed'
              for key in ('guide_sha256', 'converted_sha256'):
                  if isinstance(data.get(key), str) and re.fullmatch('[a-f0-9]{64}', data[key]):
                      report[key] = data[key]
          output = Path(os.environ['RUNNER_TEMP']) / 'modsync-install-sanitized'
          output.mkdir(mode=0o700)
          (output / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('ModSync install: ' + report['status'] + '; ' + report['reason'] + '\n')
          PY

      - name: Upload sanitized status only
        if: always() && steps.trust.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modsync-install-${{ inputs.game }}-${{ inputs.mode }}-${{ inputs.implementation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modsync-install-sanitized/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private source, game, archives and diagnostics
        if: always() && steps.trust.outcome == 'success'
        run: |
          rm -rf "$GITHUB_WORKSPACE/.modsync-private-source" "$RUNNER_TEMP/modsync-install-private" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/modsync-archives-sealed"
