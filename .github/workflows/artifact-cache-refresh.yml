name: Refresh encrypted artifact cache
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: encrypted-artifact-cache
  cancel-in-progress: false
jobs:
  refresh:
    # The payload command and licensed inputs stay on an owner-controlled runner.
    runs-on: [self-hosted, modsync-session]
    timeout-minutes: 240
    steps:
      - name: Validate private cache recipe
        shell: python
        env:
          CONFIG: ${{ secrets.FULL_BUILD_CONFIG }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          import json, os, sys
          if os.environ['REPOSITORY'] != 'kolto-labs/mod-builds' or os.environ['EVENT'] not in ('schedule', 'workflow_dispatch'):
              sys.exit('Artifact cache execution is restricted to the owner repository.')
          try:
              config = json.loads(os.environ['CONFIG'])
              command = config['artifactCache']['payloadCommand']
          except Exception:
              sys.exit('FULL_BUILD_CONFIG must contain artifactCache.payloadCommand.')
          if not isinstance(command, list) or not command or any(not isinstance(item, str) or not item for item in command):
              sys.exit('The private payload command must be a non-empty argv list.')
          if '{output-dir}' not in command:
              sys.exit('The private payload command must write stable encrypted objects under {output-dir}.')
          print('Private artifact cache recipe accepted.')
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned age
        run: python tools/private-ci/src/bootstrap_age.py --directory "$RUNNER_TEMP/age"
      - name: Create encrypted private payload
        shell: python
        env:
          CONFIG: ${{ secrets.FULL_BUILD_CONFIG }}
          OUTPUT: ${{ runner.temp }}/artifact-cache/objects
        run: |
          import json, os, pathlib, subprocess, sys
          output = pathlib.Path(os.environ['OUTPUT']); output.mkdir(mode=0o700, parents=True, exist_ok=True)
          config = json.loads(os.environ['CONFIG'])
          values = [item.replace('{output-dir}', str(output)).replace('{workspace}', os.environ['GITHUB_WORKSPACE']) for item in config['artifactCache']['payloadCommand']]
          env = {key: value for key, value in os.environ.items() if key in ('PATH', 'HOME', 'USERPROFILE', 'TEMP', 'TMP', 'TMPDIR', 'SYSTEMROOT', 'WINDIR', 'LANG', 'LC_ALL')}
          completed = subprocess.run(values, cwd=os.environ['GITHUB_WORKSPACE'], env=env, timeout=180*60)
          if completed.returncode or not any(item.is_file() and not item.is_symlink() for item in output.iterdir()):
              sys.exit('Private payload generation failed or produced no encrypted objects.')
      - name: Stage content-addressed chunks
        run: python tools/private-ci/src/artifact_store.py stage --input-dir "$RUNNER_TEMP/artifact-cache/objects" --output "$RUNNER_TEMP/artifact-cache/chunks"
      - name: Upload changed encrypted segment
        id: segment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modsync-cache-segment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-cache/chunks/*.part
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Build immutable index from the previous generation
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SEGMENT_ID: ${{ steps.segment.outputs.artifact-id }}
          OUTPUT: ${{ runner.temp }}/artifact-cache/index.json
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools/private-ci')
          from src import artifact_store
          artifacts = artifact_store.list_artifacts(os.environ['REPOSITORY'], os.environ['GITHUB_TOKEN'], 'modsync-cache-index-')
          previous = None
          if artifacts:
              latest = max((item for item in artifacts if not item.get('expired')), key=lambda item: item.get('created_at', ''), default=None)
              if latest:
                  path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'artifact-cache' / 'previous-index.json'
                  artifact_store.fetch_index(os.environ['REPOSITORY'], os.environ['GITHUB_TOKEN'], int(latest['id']), path)
                  previous = json.loads(path.read_text())
          chunks = {}
          for part in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'artifact-cache' / 'chunks').glob('*.part'):
              sha, size = artifact_store.digest(part)
              chunks[sha] = {'size': size, 'file': part.name}
          index = artifact_store.make_index(chunks, int(os.environ['SEGMENT_ID']), previous)
          output = pathlib.Path(os.environ['OUTPUT']); output.write_bytes(artifact_store.json_bytes(index))
      - name: Upload current immutable index
        id: index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modsync-cache-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-cache/index.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove unreferenced artifact generations
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INDEX_ID: ${{ steps.index.outputs.artifact-id }}
          SEGMENT_ID: ${{ steps.segment.outputs.artifact-id }}
          INDEX: ${{ runner.temp }}/artifact-cache/index.json
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools/private-ci')
          from src import artifact_store
          index = json.loads(pathlib.Path(os.environ['INDEX']).read_text())
          keep = {os.environ['INDEX_ID'], os.environ['SEGMENT_ID']} | {str(item['artifactId']) for item in index['chunks'].values()}
          artifact_store.gc(os.environ['REPOSITORY'], os.environ['GITHUB_TOKEN'], 'modsync-cache-', keep)
