name: Private CI tooling checks
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - tools/private-ci/**
      - .github/workflows/private-ci-*.yml
      - .github/workflows/modsync-private-job.yml
permissions:
  contents: read
jobs:
  credential-free-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check public tooling without private credentials or game files
        working-directory: tools/private-ci
        run: python -m unittest discover -s tests -v
