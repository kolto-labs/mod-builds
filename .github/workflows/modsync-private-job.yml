name: Encrypted private CI job
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      kind:
        type: string
        required: true
      tool-path:
        type: string
        default: tools/private-ci
      tool-repository:
        type: string
        default: kolto-labs/mod-builds
      tool-ref:
        type: string
        default: ""
      implementation:
        type: string
        default: project
      runner-mode:
        type: string
        default: hosted
    secrets:
      PRIVATE_CI_CONFIG:
        required: true
      PRIVATE_CI_TOKEN:
        required: true
      PRIVATE_CI_RECIPIENT:
        required: true
permissions:
  contents: read
concurrency:
  group: encrypted-private-ci-${{ github.repository }}-${{ inputs.implementation }}-${{ inputs.platform }}-${{ inputs.kind }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ${{ inputs.runner-mode == 'self-hosted' && fromJSON(format('["self-hosted","{0}","modsync-session"]', fromJSON('{"linux":"Linux","windows":"Windows","macos":"macOS"}')[inputs.platform])) || fromJSON('{"linux":"ubuntu-latest","windows":"windows-latest","macos":"macos-latest"}')[inputs.platform] }}
    timeout-minutes: 210
    steps:
      - name: Reject unsupported configuration and debug logging
        id: preflight
        shell: python
        env:
          CI_PLATFORM: ${{ inputs.platform }}
          CI_KIND: ${{ inputs.kind }}
          CI_RUNNER_MODE: ${{ inputs.runner-mode }}
          CI_PUBLIC_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_TOOL_REPOSITORY: ${{ inputs.tool-repository }}
          CI_TOOL_REF: ${{ inputs.tool-ref || github.sha }}
          CI_TOOL_PATH: ${{ inputs.tool-path }}
          CI_IMPLEMENTATION: ${{ inputs.implementation }}
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: |
          import os, sys
          valid = os.environ['CI_PLATFORM'] in ('linux', 'windows', 'macos') and os.environ['CI_KIND'] in ('cli', 'gui') and os.environ['CI_RUNNER_MODE'] in ('hosted', 'self-hosted')
          debug = any(os.environ.get(key, '').lower() in ('1', 'true', 'yes', 'on') for key in ('RUNNER_DEBUG', 'ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG'))
          import re, json, subprocess
          trusted = os.environ['CI_REPOSITORY_PRIVATE'] == 'false' and os.environ['CI_EVENT_NAME'] in ('workflow_dispatch', 'repository_dispatch', 'workflow_call')
          valid = valid and os.environ['CI_IMPLEMENTATION'] in ('project', 'rust', 'typescript')
          valid = valid and bool(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['CI_TOOL_REPOSITORY']))
          valid = valid and bool(re.fullmatch(r'[a-fA-F0-9]{40}', os.environ['CI_TOOL_REF']))
          valid = valid and bool(re.fullmatch(r'[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*', os.environ['CI_TOOL_PATH']))
          valid = valid and all(part not in ('.', '..') for part in os.environ['CI_TOOL_PATH'].split('/'))
          if not valid or debug or not trusted:
              sys.exit('Private CI preflight rejected the configuration.')
          response = subprocess.run(['gh', 'api', 'repos/' + os.environ['CI_TOOL_REPOSITORY']], capture_output=True, text=True)
          if response.returncode or json.loads(response.stdout).get('private') is not False:
              sys.exit('Private CI requires a public tooling repository.')
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'ci-encrypted'
          if output.is_symlink() or (output.exists() and not output.is_dir()):
              sys.exit('Private CI preflight rejected the evidence directory.')
          output.mkdir(mode=0o700, exist_ok=True)
          for path in output.iterdir():
              if path.is_symlink() or not path.is_file() or path.suffix != '.age':
                  sys.exit('Private CI preflight rejected the evidence directory.')
              path.unlink()
          print('Private CI preflight ready.')
      - name: Checkout trusted public companion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref || github.sha }}
          persist-credentials: false
      - name: Install Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned evidence encryption tool
        shell: bash
        env:
          CI_TOOL_PATH: ${{ inputs.tool-path }}
        run: python "$CI_TOOL_PATH/src/bootstrap_age.py" --directory "$RUNNER_TEMP/age"
      - name: Execute private source and encrypt evidence
        id: execute
        shell: python
        env:
          PRIVATE_CI_CONFIG: ${{ secrets.PRIVATE_CI_CONFIG }}
          PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
          PRIVATE_CI_RECIPIENT: ${{ secrets.PRIVATE_CI_RECIPIENT }}
          CI_PLATFORM: ${{ inputs.platform }}
          CI_KIND: ${{ inputs.kind }}
          CI_TOOL_PATH: ${{ inputs.tool-path }}
        run: |
          import os, pathlib, subprocess, sys
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          age = temporary / 'age' / ('age.exe' if os.name == 'nt' else 'age')
          result = subprocess.run([sys.executable, str(pathlib.Path(os.environ['CI_TOOL_PATH']) / 'src/executor.py'), '--platform', os.environ['CI_PLATFORM'], '--kind', os.environ['CI_KIND'], '--output', str(temporary / 'ci-encrypted'), '--age', str(age)])
          sys.exit(result.returncode)
      - name: Find encrypted evidence
        id: evidence
        if: always() && steps.preflight.outcome == 'success'
        shell: python
        run: |
          import os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-encrypted'
          present = output.is_dir() and any(path.is_file() and not path.is_symlink() for path in output.glob('*.age'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('present=' + str(present).lower() + '\n')
      - name: Retain encrypted evidence
        if: always() && steps.preflight.outcome == 'success' && steps.evidence.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-${{ inputs.implementation }}-${{ inputs.platform }}-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-encrypted/*.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
