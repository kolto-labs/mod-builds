name: ModSync game cache

on:
  workflow_call:
    inputs:
      game:
        type: string
        required: true
        default: both
    secrets:
      STEAM_USERNAME:
        required: true
      STEAM_PASSWORD:
        required: true
      STEAM_CONFIG_VDF:
        required: false
      CACHE_ENCRYPTION_KEY:
        required: true
  workflow_dispatch:
    inputs:
      game:
        description: Game cache to restore or acquire
        type: choice
        required: true
        default: both
        options: [k1, k2, both]
  push:
    branches: [dev, main]
    paths:
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/modsync-steam-acquire.yml'
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: modsync-game-cache
  cancel-in-progress: false

jobs:
  acquire:
    if: github.repository == 'kolto-labs/mod-builds'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'push' && inputs.game == '') || inputs.game == 'both') && '["k1","k2"]' || (inputs.game == 'k2' && '["k2"]' || '["k1"]')) }}
    env:
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require encrypted cache key
        shell: bash
        run: test "${#CACHE_ENCRYPTION_KEY}" -ge 32

      - name: Restore optional game cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: steam-sealed-v4-${{ matrix.game }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: steam-sealed-v4-${{ matrix.game }}-${{ runner.os }}-

      - name: Unseal restored game cache
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/restored" "$RUNNER_TEMP/steam-state"
          if test -f "$RUNNER_TEMP/sealed/baseline.seal"; then
            python tools/modsync-ci/seal.py unseal \
              --source "$RUNNER_TEMP/sealed/baseline.seal" \
              --destination "$RUNNER_TEMP/restored"
          fi

      - name: Validate restored game cache
        id: cache
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          python tools/modsync-ci/steam_cache.py validate \
            --root "$RUNNER_TEMP/restored" --game "$GAME" \
            --allow-missing --github-output "$GITHUB_OUTPUT"

      - name: Stage restored baseline for refresh
        if: steps.cache.outputs.cache_valid == 'true' && steps.cache.outputs.fresh != 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          umask 077
          cp -a "$RUNNER_TEMP/restored/baseline-$GAME" "$RUNNER_TEMP/steam-state/"
          install -m 600 "$RUNNER_TEMP/restored/baseline-$GAME.json" \
            "$RUNNER_TEMP/steam-state/baseline-$GAME.json"

      - name: Install SteamCMD dependency
        if: steps.cache.outputs.cache_valid != 'true' || steps.cache.outputs.fresh != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y lib32gcc-s1

      - name: Acquire game with SteamCMD when cache is unavailable
        if: steps.cache.outputs.cache_valid != 'true' || steps.cache.outputs.fresh != 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private"
          python tools/modsync-ci/steam.py acquire \
            --game "$GAME" \
            --destination "$RUNNER_TEMP/game" \
            --state-dir "$RUNNER_TEMP/steam-state" \
            --report "$RUNNER_TEMP/private/steam-report.json" \
            --timeout 1800 \
            >"$RUNNER_TEMP/private/steam.log" 2>&1

      - name: Verify acquired game output
        if: steps.cache.outputs.cache_valid != 'true' || steps.cache.outputs.fresh != 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/game"
          test -f "$RUNNER_TEMP/steam-state/baseline-$GAME.json"

      - name: Seal validated game without movies
        if: steps.cache.outputs.cache_valid != 'true' || steps.cache.outputs.fresh != 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          set -euo pipefail
          umask 077
          test -d "$RUNNER_TEMP/game"
          test -s "$RUNNER_TEMP/steam-state/baseline-$GAME.json"
          mkdir -p "$RUNNER_TEMP/clean" "$RUNNER_TEMP/sealed"
          mv "$RUNNER_TEMP/game" "$RUNNER_TEMP/clean/baseline-$GAME"
          cp "$RUNNER_TEMP/steam-state/baseline-$GAME.json" "$RUNNER_TEMP/clean/"
          python -c 'import time; print(time.time())' > "$RUNNER_TEMP/clean/refreshed-at"
          python - "$GAME" "$RUNNER_TEMP/clean" <<'PY'
          import hashlib, importlib.util, json, shutil, stat, sys
          from pathlib import Path

          game = sys.argv[1]
          clean = Path(sys.argv[2])
          tree = clean / ('baseline-' + game)
          receipt = clean / ('baseline-' + game + '.json')
          spec = importlib.util.spec_from_file_location(
              'steam_acquire', 'tools/private-ci/src/steam_acquire.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          source = receipt.read_bytes()
          if module.inventory(tree) != json.loads(source):
              raise SystemExit('Acquired game differs from its source inventory.')
          (clean / ('source-baseline-' + game + '.json')).write_bytes(source)
          excluded_count = 0
          excluded_bytes = 0
          for path in tree.rglob('*'):
              if path.is_file() and path.name.lower().endswith('.bik'):
                  excluded_count += 1
                  excluded_bytes += path.stat().st_size
                  path.unlink()
          receipt.write_text(json.dumps(module.inventory(tree), sort_keys=True))
          (clean / 'cache-scope.json').write_text(json.dumps({
              'schema': 1,
              'game': game,
              'source_receipt_sha256': hashlib.sha256(source).hexdigest(),
              'excluded_pattern': '*.bik',
              'excluded_count': excluded_count,
              'excluded_bytes': excluded_bytes,
          }, sort_keys=True))
          if any(not stat.S_ISREG(path.lstat().st_mode) and not path.is_dir()
                 for path in clean.rglob('*')):
              raise SystemExit('Game cache contains a non-regular file.')
          size = sum(path.stat().st_size for path in clean.rglob('*') if path.is_file())
          if shutil.disk_usage(clean).free < 2 * size + 1_000_000_000:
              raise SystemExit('Insufficient disk space to seal the game cache.')
          PY
          python tools/modsync-ci/seal.py seal \
            --source "$RUNNER_TEMP/clean" \
            --destination "$RUNNER_TEMP/sealed/baseline.seal"
          test -s "$RUNNER_TEMP/sealed/baseline.seal"

      - name: Save refreshed game cache
        if: steps.cache.outputs.cache_valid != 'true' || steps.cache.outputs.fresh != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: steam-sealed-v4-${{ matrix.game }}-${{ runner.os }}-${{ github.run_id }}

      - name: Remove private Steam state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/steam-state" "$RUNNER_TEMP/private" \
            "$RUNNER_TEMP/game" "$RUNNER_TEMP/restored" "$RUNNER_TEMP/clean" \
            "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/steamcmd.tar.gz"
