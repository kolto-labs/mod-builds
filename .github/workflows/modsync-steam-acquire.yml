name: ModSync Steam acquisition
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to acquire
        type: choice
        required: true
        default: k1
        options:
          - k1
          - k2
          - both
      force-refresh:
        description: Force Steam authentication and acquisition even when the verified cache is fresh
        type: boolean
        required: false
        default: false
      cache-only:
        description: Reuse an existing valid cache without refreshing it when stale (a missing cache is still acquired)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'kolto-labs/mod-builds' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.STEAM_AUTH_READY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: steam-account
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game: ${{ fromJSON((github.event_name == 'schedule' || inputs.game == 'both') && '["k1","k2"]' || (inputs.game == 'k2' && '["k2"]' || '["k1"]')) }}
    env:
      CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require cache encryption
        shell: bash
        run: test "${#CACHE_ENCRYPTION_KEY}" -ge 32
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: steam-sealed-v3-excludingmovies-${{ matrix.game }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-sealed-v3-excludingmovies-${{ matrix.game }}-${{ runner.os }}-
      - name: Restore authenticated clean baseline
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/steam-state"
          if test -f "$RUNNER_TEMP/sealed/baseline.seal"; then
            python tools/modsync-ci/seal.py unseal --source "$RUNNER_TEMP/sealed/baseline.seal" --destination "$RUNNER_TEMP/restored"
          fi
      - name: Validate authenticated filtered cache before freshness decision
        id: cache
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: python tools/modsync-ci/steam_cache.py validate --root "$RUNNER_TEMP/restored" --game "$GAME" --allow-missing --github-output "$GITHUB_OUTPUT"
      - name: Apply fourteen-day acquisition gate with daily cache access
        id: gate
        shell: python
        env:
          CACHE_FRESH: ${{ steps.cache.outputs.fresh }}
          CACHE_VALID: ${{ steps.cache.outputs.cache_valid }}
          FORCE_REFRESH: ${{ inputs.force-refresh }}
          CACHE_ONLY: ${{ inputs.cache-only }}
        run: |
          import os
          cache_fresh = os.environ.get('CACHE_FRESH') == 'true'
          cache_valid = os.environ.get('CACHE_VALID') == 'true'
          force_refresh = os.environ.get('FORCE_REFRESH', 'false').lower() == 'true'
          cache_only = os.environ.get('CACHE_ONLY', 'false').lower() == 'true'
          if force_refresh and cache_only:
              raise SystemExit('cache-only cannot be combined with force-refresh')
          missing = not cache_valid
          stale = cache_valid and not cache_fresh
          if cache_only and missing:
              raise SystemExit('cache-only requested, but the cache is missing or invalid; Steam authentication is forbidden')
          due = force_refresh or missing or (stale and not cache_only)
          if missing:
              print('Cache missing or invalid for this game; acquiring it.')
          elif stale and cache_only:
              print('Cache is stale but cache-only is set; reusing it without refresh.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('due=' + str(due).lower() + '\n')
      - name: Stage validated baseline for SteamCMD refresh
        if: steps.gate.outputs.due == 'true' && steps.cache.outputs.cache_valid == 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          umask 077
          cp -a "$RUNNER_TEMP/restored/baseline-$GAME" "$RUNNER_TEMP/steam-state/"
          install -m 600 "$RUNNER_TEMP/restored/baseline-$GAME.json" "$RUNNER_TEMP/steam-state/baseline-$GAME.json"
      - name: Install SteamCMD dependencies
        if: steps.gate.outputs.due == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y lib32gcc-s1
      - name: Observe public egress location before Steam authentication
        continue-on-error: true
        if: steps.gate.outputs.due == 'true'
        timeout-minutes: 1
        shell: bash
        run: python3 tools/modsync-ci/egress_location.py --output "$RUNNER_TEMP/steam-egress-location.json"
      - name: Publish public egress location before preparation delay
        continue-on-error: true
        if: always() && steps.gate.outputs.due == 'true'
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: steam-egress-location-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steam-egress-location.json
          if-no-files-found: error
          retention-days: 1
      - name: Allow sixty seconds to prepare for Steam authentication
        continue-on-error: true
        if: steps.gate.outputs.due == 'true'
        timeout-minutes: 2
        shell: python
        run: |
          import time
          print('Observed egress location published. Steam authentication starts in 60 seconds.', flush=True)
          time.sleep(60)
      - name: Authenticate and acquire fresh validated game
        continue-on-error: true
        id: acquisition
        if: steps.gate.outputs.due == 'true'
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_CONFIG_VDF_GZIP: ${{ secrets.STEAM_CONFIG_VDF_GZIP }}
          STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
          GAME: ${{ matrix.game }}
        run: |
          umask 077
          python - <<'PY' > "$RUNNER_TEMP/steam-private.log" 2>&1
          import base64, importlib.util, os, subprocess, traceback
          from pathlib import Path
          from urllib.error import URLError

          os.umask(0o077)
          temporary = Path(os.environ['RUNNER_TEMP'])
          diagnostic = temporary / 'steam-diagnostic.log'
          reason = 'unknown'
          exception_class = 'none'
          exception_frames = 'none'
          steam_code = 'none'
          verified = False
          module = None
          steam_auth = None
          auth_files = {}
          pending_auth_restore = {'files': auth_files}
          try:
              compressed = os.environ.pop('STEAM_CONFIG_VDF_GZIP', '')
              if compressed:
                  auth_specification = importlib.util.spec_from_file_location(
                      'steam_auth', 'tools/modsync-ci/steam_auth.py')
                  steam_auth = importlib.util.module_from_spec(auth_specification)
                  auth_specification.loader.exec_module(steam_auth)
                  auth_files = steam_auth.decode_secret(compressed)
                  pending_auth_restore['files'] = auth_files
                  configuration = auth_files[steam_auth.CONFIG_PATH]
                  os.environ['STEAM_CONFIG_VDF'] = base64.b64encode(configuration).decode('ascii')
              specification = importlib.util.spec_from_file_location('steam_acquire', 'tools/private-ci/src/steam_acquire.py')
              module = importlib.util.module_from_spec(specification)
              specification.loader.exec_module(module)
              original_run = module.run_steam
              def private_run(command, script_path, log, environment, timeout):
                  if steam_auth and pending_auth_restore['files']:
                      steam_auth.restore_auxiliary(
                          pending_auth_restore['files'], temporary / 'steam-state/home')
                      pending_auth_restore['files'] = {}
                  with diagnostic.open('wb') as private_log:
                      return original_run(command, script_path, private_log, environment, timeout)
              module.run_steam = private_run
              module.acquire_game(os.environ['GAME'], temporary / 'game',
                                  temporary / 'steam-state', temporary / 'steam-report.json',
                                  dict(os.environ), 1800)
              verified = True
              reason = 'verified'
          except Exception as error:
              if isinstance(error, getattr(module, 'SteamProcessError', ())):
                  steam_code = str(error.returncode)
                  reason = {'guard_challenge': 'steam-guard', 'confirmation_required': 'steam-guard',
                            'invalid_login': 'auth', 'no_subscription': 'ownership',
                            'dependency': 'dependency', 'timeout': 'network-or-timeout',
                            'rate_limit': 'rate-limit', 'service_unavailable': 'network-or-timeout',
                            'output_capture_failed': 'adapter-error'}.get(error.category, 'unknown')
              allowed_classes = {'TypeError', 'ValueError', 'RuntimeError', 'OSError', 'FileNotFoundError',
                                 'PermissionError', 'HTTPError', 'URLError', 'ConnectionError',
                                 'TimeoutError', 'TimeoutExpired', 'BadGzipFile', 'EOFError', 'Error',
                                 'ImportError', 'ModuleNotFoundError', 'AttributeError', 'KeyError'}
              exception_class = type(error).__name__
              if exception_class not in allowed_classes:
                  exception_class = 'OtherError'
              allowed_files = {'<stdin>', 'steam_acquire.py', 'request.py', 'error.py',
                               'gzip.py', 'base64.py', 'subprocess.py', 'client.py', 'socket.py',
                               'ssl.py', '_compression.py'}
              exception_frames = ','.join(
                  (Path(frame.filename).name if Path(frame.filename).name in allowed_files else 'redacted')
                  + ':' + str(frame.lineno)
                  for frame in traceback.extract_tb(error.__traceback__)
              ) or 'none'
              if isinstance(error, TypeError):
                  reason = 'adapter-error'
              if isinstance(error, (URLError, ConnectionError, subprocess.TimeoutExpired)):
                  reason = 'network-or-timeout'
              if reason == 'unknown' and (not os.environ.get('STEAM_USERNAME') or not (
                  os.environ.get('STEAM_PASSWORD') or os.environ.get('STEAM_CONFIG_VDF')
              )):
                  reason = 'auth'
              candidates = [diagnostic]
              candidates += list((temporary / 'steam-state/home/steamcmd/logs').glob('*.txt'))
              candidates += list((temporary / 'steam-state/home/.steam/logs').glob('*.txt'))
              evidence = ''
              for candidate in candidates:
                  if candidate.is_file() and not candidate.is_symlink():
                      with candidate.open('rb') as source:
                          source.seek(max(0, candidate.stat().st_size - 4 * 1024 * 1024)
                          evidence += source.read().decode('utf-8', errors='replace').lower()
              for category, markers in (
                  ('steam-guard', ('steam guard code', 'two-factor code', 'two factor code', 'account logon denied', 'auth code', 'email code', 'waiting for confirmation')),
                  ('ownership', ('no subscription', 'no license', 'missing license', 'does not own')),
                  ('auth', ('invalid password', 'invalid login', 'login failure', 'invalid credentials', 'account disabled')),
                  ('network-or-timeout', ('connection failed', 'connection timeout', 'connection timed out', 'failed to connect', 'no connection')),
              ):
                  if reason == 'unknown' and any(marker in evidence for marker in markers):
                      reason = category
                      break
          finally:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('reason=' + reason + '\n')
                  output.write('exception_class=' + exception_class + '\n')
                  output.write('exception_frames=' + exception_frames + '\n')
                  output.write('steam_code=' + steam_code + '\n')
          raise SystemExit(0 if verified else 1)
          PY
      - name: Check critical acquisition output
        id: critical
        if: always() && steps.gate.outputs.due == 'true'
        shell: python
        env:
          GAME: ${{ matrix.game }}
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: |
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          game = os.environ['GAME']
          outcome = os.environ['ACQUISITION_OUTCOME']
          game_root = temporary / 'game'
          receipt = temporary / 'steam-state' / ('baseline-' + game + '.json')
          ok = outcome == 'success' and game_root.is_dir() and receipt.is_file()
          reason = 'verified' if ok else 'acquisition did not produce a validated game directory and receipt'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ok=' + ('true' if ok else 'false') + '\n')
              output.write('reason=' + reason + '\n')
          print('Critical acquisition output: ' + reason)
      - name: Persist successful SteamCMD authentication
        id: persist_auth
        continue-on-error: true
        if: always() && steps.acquisition.outcome == 'success' && steps.critical.outputs.ok == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
          GAME: ${{ matrix.game }}
        run: |
          import importlib.util, os, subprocess
          from pathlib import Path

          try:
              specification = importlib.util.spec_from_file_location(
                  'steam_auth', 'tools/modsync-ci/steam_auth.py')
              steam_auth = importlib.util.module_from_spec(specification)
              specification.loader.exec_module(steam_auth)
              home = Path(os.environ['RUNNER_TEMP']) / 'steam-state/home'
              encoded = steam_auth.encode_secret(steam_auth.capture(home)).encode('ascii')
              subprocess.run(
                  ['gh', 'secret', 'set', 'STEAM_CONFIG_VDF_GZIP', '-R', os.environ['GITHUB_REPOSITORY']],
                  input=encoded, capture_output=True, check=True,
              )
              (Path(os.environ['RUNNER_TEMP']) / ('steam-auth-proven-' + os.environ['GAME'] + '.txt')).write_text(
                  'game=' + os.environ['GAME'] + '\nportable_auth=verified\n', encoding='ascii')
          except Exception:
              raise SystemExit('SteamCMD authentication persistence failed; private details suppressed.') from None
          print('SteamCMD authentication stored; awaiting independent proof for both games.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('SteamCMD authentication stored; readiness remains disabled until both game proofs pass.\n')
      - name: Publish sanitized per-game auth proof
        continue-on-error: true
        if: always() && steps.persist_auth.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: steam-auth-proven-${{ matrix.game }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steam-auth-proven-${{ matrix.game }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Seal private acquisition failure diagnostics
        continue-on-error: true
        id: diagnostics
        if: always() && steps.acquisition.outcome == 'failure'
        shell: bash
        env:
          CACHE_ENCRYPTION_KEY: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_GUARD_CODE: ${{ secrets.STEAM_GUARD_CODE }}
        run: |
          umask 077
          if test -z "$CACHE_ENCRYPTION_KEY"; then
            exit 0
          fi
          python - <<'PY'
          import base64, gzip, os, stat
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          destination = temporary / 'steam-diagnostics'
          destination.mkdir(mode=0o700)
          secrets = [value.encode() for name, value in os.environ.items()
                     if name.startswith('STEAM_') and value]
          for name in ('STEAM_CONFIG_VDF', 'STEAM_CONFIG_VDF_GZIP'):
              value = os.environ.get(name, '')
              if value:
                  decoded = base64.b64decode(value, validate=True)
                  if name.endswith('_GZIP'):
                      decoded = gzip.decompress(decoded)
                  if decoded:
                      secrets.append(decoded)
          logs = temporary / 'steam-state/home/steamcmd/logs'
          candidates = [(temporary / name, Path(name)) for name in
                        ('steam-private.log', 'steam-diagnostic.log')]
          if logs.resolve() == logs.absolute() and logs.is_dir():
              candidates += [(source, Path('steamcmd/logs') / source.name)
                             for source in logs.glob('*.txt')]
          for source, relative in candidates:
              if source.resolve() != source.absolute():
                  continue
              try:
                  descriptor = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except FileNotFoundError:
                  continue
              with os.fdopen(descriptor, 'rb') as incoming:
                  metadata = os.fstat(incoming.fileno())
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                      continue
                  content = incoming.read()
              for secret in sorted(set(secrets), key=len, reverse=True):
                  content = content.replace(secret, b'[REDACTED]')
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
              with target.open('xb') as outgoing:
                  outgoing.write(content)
          PY
          python tools/modsync-ci/seal.py seal --source "$RUNNER_TEMP/steam-diagnostics" --destination "$RUNNER_TEMP/steam-diagnostics.seal"
          echo 'sealed=true' >> "$GITHUB_OUTPUT"
      - name: Upload encrypted failure diagnostics
        continue-on-error: true
        if: always() && steps.acquisition.outcome == 'failure' && steps.diagnostics.outputs.sealed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: steam-diagnostics-${{ matrix.game }}-${{ github.run_id }}
          path: ${{ runner.temp }}/steam-diagnostics.seal
          if-no-files-found: error
          retention-days: 1
      - name: Seal clean game and inventory only
        id: seal_game
        if: steps.gate.outputs.due == 'true' && steps.critical.outputs.ok == 'true'
        shell: bash
        env:
          GAME: ${{ matrix.game }}
        run: |
          umask 077
          if test ! -d "$RUNNER_TEMP/game" || test ! -f "$RUNNER_TEMP/steam-state/baseline-$GAME.json"; then
            echo "Critical acquisition output is absent; refusing to seal a nonexistent game." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/clean" "$RUNNER_TEMP/sealed"
          mv -- "$RUNNER_TEMP/game" "$RUNNER_TEMP/clean/baseline-$GAME"
          cp "$RUNNER_TEMP/steam-state/baseline-$GAME.json" "$RUNNER_TEMP/clean/"
          python -c 'import time; print(time.time())' > "$RUNNER_TEMP/clean/refreshed-at"
          python - <<'PY'
          import hashlib, importlib.util, json, os, shutil, stat
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          game = os.environ['GAME']
          if game not in ('k1', 'k2') or not temporary.is_absolute() or temporary.resolve() != temporary or temporary == Path('/'):
              raise SystemExit('Unsafe runner temporary path or game.')
          baseline = temporary / 'steam-state' / ('baseline-' + game)
          clean = temporary / 'clean'
          for directory in (baseline, clean, clean / ('baseline-' + game)):
              if directory.resolve() != directory or not directory.is_dir():
                  raise SystemExit('Unsafe generated game directory.')
          tree_bytes = 0
          for entry in clean.rglob('*'):
              metadata = entry.lstat()
              if stat.S_ISREG(metadata.st_mode) and metadata.st_nlink == 1:
                  tree_bytes += metadata.st_size
              elif not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit('Clean game must contain independent regular files only.')
          receipt = clean / ('baseline-' + game + '.json')
          if not receipt.is_file() or receipt.is_symlink():
              raise SystemExit('Clean acquisition receipt is missing.')
          specification = importlib.util.spec_from_file_location('steam_acquire', 'tools/private-ci/src/steam_acquire.py')
          module = importlib.util.module_from_spec(specification)
          specification.loader.exec_module(module)
          source_receipt = receipt.read_bytes()
          source_inventory = json.loads(source_receipt)
          cache_tree = clean / ('baseline-' + game)
          if module.inventory(cache_tree) != source_inventory:
              raise SystemExit('Full source copy does not match Steam acquisition receipt.')
          (clean / ('source-baseline-' + game + '.json')).write_bytes(source_receipt)
          excluded_count = 0
          excluded_bytes = 0
          for entry in cache_tree.rglob('*'):
              if entry.is_file() and entry.name.lower().endswith('.bik'):
                  excluded_bytes += entry.stat().st_size
                  excluded_count += 1
                  entry.unlink()
          receipt.write_text(json.dumps(module.inventory(cache_tree), sort_keys=True))
          (clean / 'cache-scope.json').write_text(json.dumps({
              'schema': 1,
              'game': game,
              'source_receipt_sha256': hashlib.sha256(source_receipt).hexdigest(),
              'excluded_pattern': '*.bik',
              'excluded_count': excluded_count,
              'excluded_bytes': excluded_bytes,
          }, sort_keys=True))
          tree_bytes = sum(entry.stat().st_size for entry in clean.rglob('*') if entry.is_file())
          reserve = 1_000_000_000
          required = 2 * tree_bytes + reserve
          available = shutil.disk_usage(temporary).free
          print(f'Seal disk preflight: tree={tree_bytes} bytes, free={available} bytes, required={required} bytes.')
          if available < required:
              raise SystemExit('Insufficient free disk space to seal the clean game with reserve.')
          PY
          python tools/modsync-ci/seal.py seal --source "$RUNNER_TEMP/clean" --destination "$RUNNER_TEMP/sealed/baseline.seal"
      - name: Enforce shared 10 GB cache budget
        continue-on-error: true
        id: budget
        if: steps.gate.outputs.due == 'true' && steps.critical.outputs.ok == 'true' && steps.seal_game.outcome == 'success'
        shell: python
        env:
          GAME: ${{ matrix.game }}
        run: |
          import os
          from pathlib import Path
          budget = {'k1': 4_000_000_000, 'k2': 5_000_000_000}[os.environ['GAME']]
          size = (Path(os.environ['RUNNER_TEMP']) / 'sealed/baseline.seal').stat().st_size
          print(f'Encrypted baseline: {size} bytes; game budget: {budget} bytes.')
          if size > budget:
              raise SystemExit('Baseline exceeds its per-game sealed cache budget; use external storage. Cache not saved.')
          print('Sealed baseline fits its budget (9 GB for both games; 1 GB nominal headroom). Older cache entries may cause LRU eviction despite daily access.')
      - name: Require nonempty sealed cache input
        continue-on-error: true
        id: cache_input
        if: steps.gate.outputs.due == 'true' && steps.critical.outputs.ok == 'true' && steps.seal_game.outcome == 'success' && steps.budget.outcome == 'success'
        shell: bash
        run: test -s "$RUNNER_TEMP/sealed/baseline.seal"
      - uses: actions/cache/save@v4
        continue-on-error: true
        id: cache_save
        if: steps.gate.outputs.due == 'true' && steps.critical.outputs.ok == 'true' && steps.seal_game.outcome == 'success' && steps.budget.outcome == 'success' && steps.cache_input.outcome == 'success'
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: steam-sealed-v3-excludingmovies-${{ matrix.game }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Hard-fail incomplete critical acquisition
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          ACQUISITION_DUE: ${{ steps.gate.outputs.due }}
          CRITICAL_OUTCOME: ${{ steps.critical.outputs.ok }}
          SEAL_OUTCOME: ${{ steps.seal_game.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          CACHE_INPUT_OUTCOME: ${{ steps.cache_input.outcome }}
          CACHE_OUTCOME: ${{ steps.cache_save.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist_auth.outcome }}
        run: |
          if test "$GATE_OUTCOME" != success; then
            echo "Critical Steam workflow gate failed; no acquisition result is trustworthy." >&2
            exit 1
          fi
          if test "$ACQUISITION_DUE" != true; then
            exit 0
          fi
          if test "$CRITICAL_OUTCOME" != true; then
            echo "Critical Steam acquisition failed: no validated game directory and receipt were produced." >&2
            exit 1
          fi
          if test "$PERSIST_OUTCOME" != success; then
            echo "Critical Steam authentication persistence failed after game acquisition." >&2
            exit 1
          fi
          if test "$SEAL_OUTCOME" != success || test "$BUDGET_OUTCOME" != success || test "$CACHE_INPUT_OUTCOME" != success || test "$CACHE_OUTCOME" != success; then
            echo "Critical Steam cache publication failed after game acquisition." >&2
            exit 1
          fi
      - name: Publish sanitized status only
        continue-on-error: true
        if: always()
        shell: python
        env:
          ACQUISITION_DUE: ${{ steps.gate.outputs.due }}
          ACQUISITION_REASON: ${{ steps.acquisition.outputs.reason }}
          ACQUISITION_EXCEPTION: ${{ steps.acquisition.outputs.exception_class }}
          ACQUISITION_FRAMES: ${{ steps.acquisition.outputs.exception_frames }}
          STEAM_PROCESS_CODE: ${{ steps.acquisition.outputs.steam_code }}
          CACHE_SAVE_OUTCOME: ${{ steps.cache_save.outcome }}
          JOB_STATUS: ${{ job.status }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        run: |
          import os, re
          reason = os.environ.get('ACQUISITION_REASON', '')
          allowed = {'verified', 'steam-guard', 'auth', 'ownership', 'network-or-timeout', 'adapter-error', 'dependency', 'rate-limit', 'unknown'}
          reason = reason if reason in allowed else 'setup-or-cache-failure'
          print('Steam acquisition status: ' + reason)
          code = os.environ.get('STEAM_PROCESS_CODE', '')
          if re.fullmatch(r'-?\d{1,10}', code):
              print('Steam process return code: ' + code)
          category = os.environ.get('ACQUISITION_EXCEPTION', '')
          frames = os.environ.get('ACQUISITION_FRAMES', '')
          if re.fullmatch(r'[A-Za-z]{1,40}', category):
              print('Steam exception category: ' + category)
          if re.fullmatch(r'[A-Za-z0-9_.:,<>-]{1,600}', frames):
              print('Steam failure frames: ' + frames)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if os.environ['ACQUISITION_DUE'] == 'false':
                  summary.write('Authenticated baseline passed scope, source-receipt and filtered-inventory checks and is younger than fourteen days; Steam acquisition skipped. Daily cache restore refreshes access within the seven-day eviction window.\n')
              else:
                  summary.write('Steam acquisition status: ' + reason + '.\n')
                  if reason == 'unknown':
                      summary.write('No conclusive Steam Guard/auth/ownership/network evidence; private diagnostics were suppressed.\n')
                  summary.write('Cache save outcome: ' + os.environ['CACHE_SAVE_OUTCOME'] + '.\n')
              summary.write('Job status: ' + os.environ['JOB_STATUS'] + '.\n')
              if os.environ['BUDGET_OUTCOME'] == 'failure':
                  summary.write('Cache budget exceeded: encrypted baseline exceeds its game budget (K1: 4 GB; K2: 5 GB); cache was not saved.\n')
      - name: Remove private state
        continue-on-error: true
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/steam-state" "$RUNNER_TEMP/clean" "$RUNNER_TEMP/game" "$RUNNER_TEMP/restored" "$RUNNER_TEMP/steam-private.log" "$RUNNER_TEMP/steam-diagnostic.log" "$RUNNER_TEMP/steam-report.json" "$RUNNER_TEMP/steamcmd.tar.gz" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/steam-diagnostics" "$RUNNER_TEMP/steam-diagnostics.seal"
  finalize-auth-readiness:
    needs: acquire
    if: needs.acquire.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download sanitized per-game auth proofs
        uses: actions/download-artifact@v4
        with:
          pattern: steam-auth-proven-*
          path: ${{ runner.temp }}/steam-auth-proven
          merge-multiple: true
      - name: Enable readiness only after both game proofs
        shell: python
        env:
          GH_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        run: |
          import os, subprocess
          from pathlib import Path

          proven = set()
          root = Path(os.environ['RUNNER_TEMP']) / 'steam-auth-proven'
          for marker in root.glob('steam-auth-proven-*.txt'):
              fields = {}
              for line in marker.read_text(encoding='ascii').splitlines():
                  key, separator, value = line.partition('=')
                  if separator:
                      fields[key] = value
              if set(fields) == {'game', 'portable_auth'} and fields.get('portable_auth') == 'verified' and fields.get('game') in {'k1', 'k2'}:
                  proven.add(fields['game'])
          if proven != {'k1', 'k2'}:
              print('Both-game portable auth proof is absent; scheduled acquisition remains disabled.')
              raise SystemExit(0)
          subprocess.run(
              ['gh', 'variable', 'set', 'STEAM_AUTH_READY', '--body', 'true',
               '-R', os.environ['GITHUB_REPOSITORY']],
              check=True,
          )
          print('Both-game portable auth proof verified; scheduled acquisition enabled.')
