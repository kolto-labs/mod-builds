name: Full-run Rust installation lane
on:
  workflow_call:
    inputs:
      engine_repository: {type: string, required: true}
      engine_sha: {type: string, required: true}
      guide_repository: {type: string, required: true}
      guide_sha: {type: string, required: true}
      game: {type: string, required: true}
      mode: {type: string, required: true}
      plan_id: {type: string, required: true}
      archive_cache_key: {type: string, default: ''}
      artifact_repository: {type: string, default: ''}
    secrets:
      MODSYNC_SOURCE_TOKEN: {required: false}
      ARTSTORE_READ_TOKEN: {required: false}
      CACHE_ENCRYPTION_KEY: {required: true}
      DIAGNOSTICS_ENCRYPTION_KEY: {required: true}
      MOD_CACHE_S3_READ_ACCESS_KEY_ID: {required: false}
      MOD_CACHE_S3_READ_SECRET_ACCESS_KEY: {required: false}
      MOD_CACHE_S3_ENDPOINT: {required: false}
permissions: {contents: read, actions: read}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GAME: ${{ inputs.game }}
      MODE: ${{ inputs.mode }}
      PLAN_ID: ${{ inputs.plan_id }}
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Checkout owned CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout admitted Rust engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_sha }}
          path: .modsync-source
          token: ${{ secrets.MODSYNC_SOURCE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify actual engine and guide identities
        env:
          ENGINE_SHA: ${{ inputs.engine_sha }}
          GUIDE_SHA: ${{ inputs.guide_sha }}
          ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
        run: |
          python tools/modsync-ci/fullrun_stage.py identity --engine .modsync-source --guides . \
            --engine-sha "$ENGINE_SHA" --guide-sha "$GUIDE_SHA" --output "$RUNNER_TEMP/lane-evidence/identity.json"
      - name: Reserve space on the disposable hosted runner
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Prepare native production runtime
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          packages=(7zip 7zip-rar megatools libarchive-tools pkg-config libssl-dev)
          if [[ "$MODE" == gui ]]; then
            packages+=(xvfb xauth python3-tk tesseract-ocr libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev scrot)
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          python -m pip install pykotor==2.3.12 gdown==5.2.0
          python tools/modsync-ci/bootstrap_rclone.py --directory "$RUNNER_TEMP/rclone"
      - name: Install native GUI input libraries
        if: ${{ inputs.mode == 'gui' }}
        run: |
          python -m pip install PyAutoGUI==0.9.54 pytesseract==0.3.13 Pillow==11.3.0
          python -c 'import tkinter'
      - name: Prefetch locked engine dependencies without persistent Git credentials
        working-directory: .modsync-source
        env:
          SOURCE_TOKEN: ${{ secrets.MODSYNC_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cfg="$RUNNER_TEMP/fullrun-git-config"
          trap 'rm -f "$cfg"' EXIT
          : > "$cfg"
          if [[ -n "$SOURCE_TOKEN" ]]; then
            git config --file "$cfg" url."https://x-access-token:$SOURCE_TOKEN@github.com/".insteadOf https://github.com/
          fi
          GIT_CONFIG_GLOBAL="$cfg" CARGO_NET_GIT_FETCH_WITH_CLI=true cargo fetch --locked
      - name: Restore sealed game accelerator
        id: game_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/sealed/*.seal
          key: game-${{ inputs.game }}-v1
          restore-keys: steam-sealed-v3-excludingmovies-${{ inputs.game }}-Linux-
      - name: Recover and verify the lane-local game baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTSTORE_READ_TOKEN: ${{ secrets.ARTSTORE_READ_TOKEN }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          LEGACY_REPOSITORY: ${{ inputs.artifact_repository }}
        run: |
          python tools/modsync-ci/fullrun_baseline.py --game "$GAME" \
            --seal-dir "$RUNNER_TEMP/sealed" --game-dir "$RUNNER_TEMP/game" \
            --legacy-repository "$LEGACY_REPOSITORY" --consumer --required
          python tools/modsync-ci/game_cache.py normalize-case --game "$GAME" --game-dir "$RUNNER_TEMP/game" --label "$MODE"
          rm -rf -- "$RUNNER_TEMP/sealed"
      - name: Restore archive accelerator
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/mod-cache
          key: ${{ inputs.archive_cache_key || 'mod-archives-' }}
          restore-keys: mod-archives-
      - name: Install the admitted full guide and require complete coverage
        env:
          ARTSTORE_REPOSITORY: ${{ inputs.artifact_repository || github.repository }}
          ARTSTORE_TOKEN: ${{ secrets.ARTSTORE_READ_TOKEN || github.token }}
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
          RCLONE_CONFIG_MODCACHE_TYPE: s3
          RCLONE_CONFIG_MODCACHE_PROVIDER: Cloudflare
          RCLONE_CONFIG_MODCACHE_REGION: auto
          RCLONE_CONFIG_MODCACHE_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_MODCACHE_ACCESS_KEY_ID: ${{ secrets.MOD_CACHE_S3_READ_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MODCACHE_SECRET_ACCESS_KEY: ${{ secrets.MOD_CACHE_S3_READ_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MODCACHE_ENDPOINT: ${{ secrets.MOD_CACHE_S3_ENDPOINT }}
          MOD_CACHE_BUCKET: ${{ vars.MOD_CACHE_BUCKET }}
        run: |
          python tools/modsync-ci/fullrun_stage.py install --engine .modsync-source --guides . \
            --game "$GAME" --mode "$MODE" --game-dir "$RUNNER_TEMP/game" \
            --cache "$RUNNER_TEMP/mod-cache" --work-dir "$RUNNER_TEMP/lane-work" --output "$RUNNER_TEMP/lane-evidence"
      - name: Retain encrypted lane evidence
        if: ${{ success() || failure() }}
        uses: ./.github/actions/retain-fullrun-evidence
        with:
          source: ${{ runner.temp }}/lane-evidence
          name: fullrun-${{ inputs.game }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          encryption-key: ${{ secrets.DIAGNOSTICS_ENCRYPTION_KEY }}
