name: Artifact cache toolkit checks
on:
  push:
    branches: [dev]
    paths:
      - tools/private-ci/src/artifact_store.py
      - tools/private-ci/tests/test_artifact_store.py
      - .github/workflows/artifact-cache-toolkit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Test artifact-backed content addressing without credentials
        working-directory: tools/private-ci
        run: python -m unittest tests.test_artifact_store -v
